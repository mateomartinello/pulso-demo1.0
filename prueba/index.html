<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F0E8">
<title>Pulso</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="iconos/icon-192.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pulso">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: una columna (máx. 720px); cuestionario inicial de una pregunta por pantalla; luego pestañas Hoy / Movimiento / Semana / Historial / Recetario / Perfil. */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
:root{
  --bg:#F5F0E8; --box:#E8E0D0; --card:#FBF8F2; --ink:#1C2018; --body:#3A3E2E; --muted:#5A5E4A;
  --green:#4A5C42; --gold:#C8C4A0; --ok:#3F6B3A; --ok-bg:#DCE6D3; --warn:#8A5A12; --warn-bg:#F1E3C4; --bad:#7A2E22; --bad-bg:#F1DCD5;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171A14;--box:#22271E;--card:#1D2119;--ink:#ECE6D8;--body:#D2CCBC;--muted:#A3A08C;--green:#8AA27E;--gold:#4F4C38;
  --ok:#A9CC9F;--ok-bg:#26381F;--warn:#E6C27A;--warn-bg:#3D3016;--bad:#F0A898;--bad-bg:#4A2219;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171A14;--box:#22271E;--card:#1D2119;--ink:#ECE6D8;--body:#D2CCBC;--muted:#A3A08C;--green:#8AA27E;--gold:#4F4C38;
  --ok:#A9CC9F;--ok-bg:#26381F;--warn:#E6C27A;--warn-bg:#3D3016;--bad:#F0A898;--bad-bg:#4A2219;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-inline:18px;padding-block:22px 64px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:clamp(26px,6vw,34px);line-height:1.1;margin:.2em 0 0;text-wrap:balance}
.date{font-size:13.5px;color:var(--muted)}
.tabs{overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;margin:16px 0 18px;border-bottom:1px solid var(--gold)}
.tab{font:inherit;font-size:14px;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.slot:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:16px}
.slots{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.slot{flex:0 0 auto;font:inherit;font-size:12.5px;background:var(--card);color:var(--body);border:1px solid var(--gold);border-radius:999px;padding:6px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.slot[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slot .ck{font-weight:700;color:var(--ok)} .slot[aria-pressed="true"] .ck{color:var(--bg)}
.card{background:var(--card);border:1px solid var(--gold);border-radius:8px;padding:18px}
.hero{border-top:3px solid var(--ink)}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h2{font-family:var(--serif);font-size:23px;line-height:1.2;color:var(--ink);margin:6px 0 4px;text-wrap:balance}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin:0 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--muted)}
.factor{display:inline-block;background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:600;border-radius:4px;padding:2px 8px;margin-top:8px}
.ing{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--gold)}
.ing li{display:contents}
.ing span{padding:7px 0;border-bottom:1px solid var(--gold);font-size:14px}
.ing span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;padding-left:12px;white-space:nowrap}
.ing small{color:var(--muted);font-weight:400}
ol.steps{margin:14px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:6px;padding:9px 14px;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.small{font-size:13px;padding:6px 10px}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--gold);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;background:var(--card);color:var(--body);border:0;border-right:1px solid var(--gold);padding:8px 10px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--bg)}
.actions{margin-top:16px;padding-top:14px;border-top:1px solid var(--gold);display:flex;flex-direction:column;gap:10px}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pi{background:var(--card);border:1px solid var(--gold);border-radius:6px;padding:10px 12px;min-width:0}
.pi .v{font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pi .v small{font-size:12px;font-weight:500;color:var(--muted)}
.pi .k{font-size:12px;color:var(--muted)}
.bar{height:5px;background:var(--box);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.pi.done{border-color:var(--ok)} .pi.done .bar i{background:var(--ok)}
.pi.over{border-color:var(--warn)} .pi.over .bar i{background:var(--warn)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--gold);font-size:14px;align-items:flex-start}
.log li > div{min-width:0}
.log .s{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.x{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
textarea,input[type=number],select{font:inherit;color:var(--body);background:var(--card);border:1px solid var(--gold);border-radius:6px;padding:8px 10px}
textarea{width:100%;min-height:64px;resize:vertical}
input[type=number]{width:90px}
.ex{background:var(--warn-bg);border-color:var(--warn)}
.ex h3{color:var(--warn)}
.banner{background:var(--box);border-left:3px solid var(--warn);padding:10px 12px;font-size:13.5px}
.det{font-size:12.5px;color:var(--muted);margin-top:2px}
.det.warn{color:var(--warn)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--gold);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.ok{color:var(--ok);font-weight:600} td.low{color:var(--bad)} td.hi{color:var(--warn);font-weight:600}
.rgroup{display:flex;flex-direction:column;gap:10px}
details.rec{background:var(--card);border:1px solid var(--gold);border-radius:6px;padding:10px 14px}
details.rec summary{cursor:pointer;font-weight:600;color:var(--ink);list-style:none;display:flex;justify-content:space-between;gap:10px}
details.rec summary::-webkit-details-marker{display:none}
details.rec summary span:last-child{font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11px;font-weight:600;border-radius:4px;padding:2px 7px;background:var(--box);color:var(--body)}
.tag.r{background:var(--bad-bg);color:var(--bad)} .tag.c{background:var(--ok-bg);color:var(--ok)}
.sep{height:1px;background:var(--gold);margin:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


.btn.ghost{border-color:var(--gold);color:var(--muted)}
.btn.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:6px 0;font-weight:500}
.btn.big{font-size:16px;padding:13px 18px;width:100%}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:inherit;font-size:13.5px;background:var(--card);color:var(--body);border:1px solid var(--gold);border-radius:999px;padding:7px 12px;cursor:pointer}
.opt.on{background:var(--green);border-color:var(--green);color:var(--bg)}
.opt:focus-visible,.choice:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#onb{max-width:560px;margin:0 auto;padding-inline:18px;padding-block:28px 64px}
.onb-card{display:flex;flex-direction:column;gap:14px}
.onb-card h1{font-size:clamp(34px,9vw,46px)}
.onb-card h2{font-size:26px;margin:0}
.lead{font-family:var(--serif);font-size:20px;color:var(--ink);margin:0;text-wrap:balance}
.onb-prog{height:2px;background:var(--gold);overflow:hidden}
.onb-prog i{display:block;height:100%;background:#fff;transition:width .25s}
#cuenta{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:5px;background:var(--box);z-index:40}
#cuenta i{display:block;height:100%;width:0;background:var(--green)}
.campos{display:flex;flex-direction:column;gap:12px}
.campo{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.campo input{font:inherit;font-size:16px;font-weight:400;color:var(--body);background:var(--card);border:1px solid var(--gold);border-radius:6px;padding:11px 12px}
.campo input:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.enlace-baja{margin:4px 0 0;text-align:center;font-size:12.5px} .enlace-baja a{color:var(--muted)}
.btn.peligro{background:var(--bad);border-color:var(--bad);color:var(--bg)}
#baja-resp{width:100%;font:inherit;font-size:16px;color:var(--body);background:var(--card);border:1px solid var(--gold);border-radius:6px;padding:10px 12px}
.aviso-tyc{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:12px 14px;font-weight:500}
.btn-perfil{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.btn-perfil svg{width:22px;height:22px}
.btn-perfil[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-perfil:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.top{align-items:flex-start;flex-wrap:nowrap}
.top .date{margin-top:4px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{font:inherit;font-size:15px;text-align:left;background:var(--card);color:var(--body);border:1px solid var(--gold);border-radius:8px;padding:13px 14px;cursor:pointer}
.choice.on{border-color:var(--green);background:var(--ok-bg);color:var(--ink);font-weight:600}
.otro-wrap input,#emoOtro{width:100%}
input[type=text]{font:inherit;color:var(--body);background:var(--card);border:1px solid var(--gold);border-radius:6px;padding:10px 12px}
.onb-nav{justify-content:space-between;margin-top:4px}
.nums{display:flex;flex-direction:column;gap:12px}
.num{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--gold);border-radius:8px;padding:10px 14px}
.numrow{display:flex;align-items:center;gap:8px}
.numrow input{width:100px;font-size:16px}
.checks{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.legal{font-size:13px;color:var(--body)} .legal p{margin:8px 0}
.care{border-color:var(--ok);background:var(--ok-bg)}
.ideas{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
#sheet{position:fixed;inset:0;background:rgba(20,22,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
.sheet-card{background:var(--bg);border-radius:12px;padding:18px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet-card h2{margin:0}
.pasos-inst{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.aviso-inst{margin:0;background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px}
@media (prefers-reduced-motion:reduce){.onb-prog i{transition:none}}

</style>
</head>
<body>

<div id="onb" hidden></div>
<div id="app" hidden>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">Comer · moverte · descansar</div>
      <h1>Pulso</h1>
      <div class="date" id="fecha"></div>
    </div>
    <button type="button" id="btnPerfil" class="btn-perfil" aria-label="Perfil" title="Perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c0-4.2 3.6-6.5 8-6.5s8 2.3 8 6.5"/></svg></button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="hoy">Hoy</button>
    <button class="tab" role="tab" data-v="mov">Movimiento</button>
    <button class="tab" role="tab" data-v="semana">Semana</button>
    <button class="tab" role="tab" data-v="historial">Historial</button>
    <button class="tab" role="tab" data-v="recetario">Recetario</button>
  </div>
  <div id="storeBanner" class="banner" hidden>Este navegador no está guardando tus datos (modo privado o almacenamiento bloqueado). Lo que registres se pierde al cerrar.</div>
  <div id="v-hoy" class="stack"></div>
  <div id="v-mov" class="stack" hidden></div>
  <div id="v-semana" class="stack" hidden></div>
  <div id="v-historial" class="stack" hidden></div>
  <div id="v-recetario" class="stack" hidden></div>
  <div id="v-perfil" class="stack" hidden></div>
</div>
</div>
<div id="cuenta" hidden aria-hidden="true"><i></i></div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Hambre y emociones"></div>

<script>

      veg+=g*f.v; fru+=g*f.fr; integ+=g*(it.integral && f.b ? Math.max(f.ig,1) : f.ig); if(f.nz) nuez+=g; if(f.c && g>=60) vitC=true; if(f.r) roja=true; if(f.a) atun=true; }
    return {
      items: out.map(it=>({n:it.food.n, g:it.g, l:it.food.l, u:it.food.u, uN:it.food.uN, auto:!!it.auto, nota:it.nota||""})),
      sobras,
      kcal:Math.round(kcal), prot:Math.round(prot), fibra:Math.round(fibra),
      verduras:Math.round(veg/80*2)/2, frutas:Math.round(fru/150*2)/2, integrales:Math.round(integ/30*2)/2,
      nueces: nuez>=15?1:0, vitC, roja, atun
    };
  }
  function describir(it){
    const unidad = it.l? "ml":"g";
    if(it.u && it.u>=20 && !it.l){ const n=it.g/it.u; if(Math.abs(n-Math.round(n))<0.01 && n>=1 && n<=24){
      const un=it.uN||""; const base=norm(it.n).split(" ")[0];
      if(!un || un==="unidad" || sing(norm(un))===sing(base)) return n===1? it.n : `${it.n} ×${n}`;
      return `${it.n} (${n} ${n===1?un:plural(un)})`; } }
    return `${it.n} ${it.g} ${unidad}`;
  }
  function plural(w){ if(/[aeiouáéí]$/.test(w)) return w+"s"; if(w.endsWith("z")) return w.slice(0,-1)+"ces"; if(w.endsWith("ón")) return w.slice(0,-2)+"ones"; if(w.endsWith("án")) return w.slice(0,-2)+"anes"; return w+"es"; }
  return {init, analizar, describir, _toks:toks};
})();

// Independientes de «compartir datos»: usan un código propio (DB.avisos.id), distinto de DB.anonId.
const TXT_DATOS_AVISOS = "Para enviarlos guardamos en nuestro servidor la dirección de notificaciones de este dispositivo, los horarios de tus comidas y qué comidas ya registraste (no qué comiste), con un código aparte de los datos anónimos. Podés desactivarlos cuando quieras desde Perfil.";
const TXT_BLOQUEADO = "Las notificaciones de Pulso están bloqueadas en este dispositivo. Para activarlas: en iPhone, Configuración › Notificaciones › Pulso; en Android, si la instalaste, mantené apretado el ícono de Pulso › Información de la app › Notificaciones, y si la usás en Chrome, tocá el ícono junto a la dirección › Permisos › Notificaciones.";
const AVISOS_OK = () => !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && CONFIG.VAPID_PUBLICA) && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function estadoAvisos(){
  if(DB.avisos?.on) return "on";
  if(ES_IOS && !EN_INICIO()) return IOS_VIEJO? "viejo" : "instalar";
  if(!AVISOS_OK()) return "no";
  return Notification.permission==="denied" ? "bloqueado" : "off";
}
function b64u(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); return Uint8Array.from(atob(s+"===".slice((s.length+3)%4)), c=>c.charCodeAt(0)); }
async function rpc(fn, body){
  const res=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{"apikey":CONFIG.SUPABASE_ANON_KEY,"Authorization":"Bearer "+CONFIG.SUPABASE_ANON_KEY,"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if(!res.ok) throw new Error(fn+" "+res.status);
  return res.json();
}
function horariosAvisos(){ const P=PLAN||calcPlan(DB.perfil); return Object.fromEntries(ESTRUCTURAS[P.est].slots.map(([k])=>[k, P.horas[k].padStart(5,"0")])); }
function zonaAvisos(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || "America/Argentina/Buenos_Aires"; }catch(e){ return "America/Argentina/Buenos_Aires"; } }
function listaHorarios(){ const P=PLAN||calcPlan(DB.perfil); const xs=ESTRUCTURAS[P.est].slots.map(([k])=>`${SLOTDEF[k].n.toLowerCase()} (${P.horas[k]} h)`); return xs.length>1? xs.slice(0,-1).join(", ")+" y "+xs[xs.length-1] : xs[0]; }

async function guardarSuscripcion(sub){
  const j=sub.toJSON(), horarios=horariosAvisos(), zona=zonaAvisos();
  const ok=await rpc("guardar_suscripcion",{p_id:DB.avisos.id, p_secret:DB.avisos.secret, p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_horarios:horarios, p_zona:zona});
  if(!ok) throw new Error("rechazada");
  DB.avisos.firma=JSON.stringify([j.endpoint,horarios,zona]); persist();
}
async function suscripcionPush(){
  const reg=await navigator.serviceWorker.ready; let sub=await reg.pushManager.getSubscription();
  if(sub && DB.avisos?.vapid && DB.avisos.vapid!==CONFIG.VAPID_PUBLICA){ await sub.unsubscribe(); sub=null; }
  return sub || reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(CONFIG.VAPID_PUBLICA)});
}
// Devuelve null si se activaron; si no, el mensaje para mostrar. El permiso se pide primero, dentro del toque (lo exige iPhone).
async function activarAvisos(){
  if(!AVISOS_OK()) return "Este navegador no permite notificaciones.";
  let perm; try{ perm=await Notification.requestPermission(); }catch(e){ perm="default"; }
  if(perm!=="granted") return perm==="denied"? TXT_BLOQUEADO : "No se activaron los recordatorios.";
  try{
    const sub=await suscripcionPush();
    DB.avisos={cola:[], ...(DB.avisos||{}), id:DB.avisos?.id||uid(), secret:DB.avisos?.secret||uid()+uid(), on:true, vapid:CONFIG.VAPID_PUBLICA}; persist();
    await guardarSuscripcion(sub);
    for(const c of day().comidas) marcarAviso(S.today, c.slot, true);
    return null;
  }catch(e){ if(DB.avisos){ DB.avisos.on=false; persist(); } return "No se pudieron activar los recordatorios. Revisá la conexión y probá de nuevo."; }
}
async function desactivarAvisos(){
  try{ const sub=await (await navigator.serviceWorker.ready).pushManager.getSubscription(); if(sub) await sub.unsubscribe(); }catch(e){}
  if(DB.avisos?.id){ try{ await rpc("borrar_suscripcion",{p_id:DB.avisos.id, p_secret:DB.avisos.secret}); }catch(e){} }
  DB.avisos={...(DB.avisos||{}), on:false, firma:null, cola:[]}; persist();
}
// Al abrir la app: si cambió la suscripción, los horarios o la zona horaria, se actualizan en el servidor.
async function sincronizarAvisos(){
  if(!DB.avisos?.on || !AVISOS_OK() || !DB.perfil?.completo) return;
  if(Notification.permission==="denied"){ await desactivarAvisos(); return; }
  try{ const sub=await suscripcionPush(); const j=sub.toJSON();
    if(JSON.stringify([j.endpoint,horariosAvisos(),zonaAvisos()])!==DB.avisos.firma) await guardarSuscripcion(sub); }catch(e){}
  enviarMarcas();
}
// «Esta comida ya está registrada»: solo la fecha y el momento del día, sin el contenido.
function marcarAviso(fecha, momento, hecho){
  if(!DB.avisos?.on) return;
  DB.avisos.cola=(DB.avisos.cola||[]).filter(m=>!(m.f===fecha && m.m===momento)); DB.avisos.cola.push({f:fecha, m:momento, h:hecho}); persist(); enviarMarcas();
}
let marcando=false;
async function enviarMarcas(){
  if(marcando || !DB.avisos?.on || !DB.avisos.cola?.length || !navigator.onLine) return;

    DB.avisos.cola.shift(); persist(); } }catch(e){}
  marcando=false;
}

// ==== CUENTA: ingreso con código por mail (Supabase Auth) y respaldo de los datos ====
// La persona entra con su mail y un código de 6 dígitos (Supabase Auth › Email › Email OTP length) (no con un enlace: en iPhone, el enlace se abriría en Safari
// y no en la app de la pantalla de inicio). La tabla «usuarios» guarda una copia de sus respuestas y registros.
const AUTH_URL = () => CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/auth/v1";
async function authPost(ruta, body, token){
  const res=await fetch(AUTH_URL()+ruta,{method:"POST",
    headers:{"apikey":CONFIG.SUPABASE_ANON_KEY,"Content-Type":"application/json",...(token?{"Authorization":"Bearer "+token}:{})}, body:JSON.stringify(body||{})});
  let j=null; try{ j=await res.json(); }catch(e){}
  return {ok:res.ok, status:res.status, j};
}
function guardarSesion(j){
  DB.auth={access_token:j.access_token, refresh_token:j.refresh_token, expira:Date.now()+(j.expires_in||3600)*1000,
    user:{id:j.user?.id||DB.auth?.user?.id, email:(j.user?.email||DB.auth?.user?.email||"").toLowerCase()}};
  persist();
}
let renovando=null;
async function tokenVigente(){
  if(!DB.auth) return null;
  if(Date.now() < DB.auth.expira-60000) return DB.auth.access_token;
  if(!renovando) renovando=(async()=>{
    try{ const r=await authPost("/token?grant_type=refresh_token",{refresh_token:DB.auth.refresh_token});
      if(r.ok){ guardarSesion(r.j); return DB.auth.access_token; }
      if(r.status>=400 && r.status<500){ DB.auth=null; persist(); render(); }   // sesión vencida: vuelve a pedir el mail; los datos del dispositivo quedan
      return null;
    }catch(e){ return null; } finally{ renovando=null; } })();
  return renovando;
}
async function rpcCuenta(fn, body, keepalive){
  const tk=await tokenVigente(); if(!tk) throw new Error("sin sesión");
  const res=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST", keepalive:!!keepalive,
    headers:{"apikey":CONFIG.SUPABASE_ANON_KEY,"Authorization":"Bearer "+tk,"Content-Type":"application/json"}, body:JSON.stringify(body||{})});
  if(!res.ok) throw new Error(fn+" "+res.status);
  return res.json();
}

// ---- Respaldo: copia del perfil y los registros en la cuenta (se sube sola, unos segundos después de cada cambio) ----
let respaldoT=null;
function respaldoPronto(ya){ clearTimeout(respaldoT); respaldoT=setTimeout(()=>subirRespaldo(), ya?0:4000); }
async function subirRespaldo(keepalive){
  if(!DB.auth || !DB.perfil?.completo || !DB.consent?.acepta || !navigator.onLine) return;
  const resp={perfil:DB.perfil, dias:DB.dias, consent:DB.consent, secret:DB.secret};
  const firma=String(hash(JSON.stringify(resp))); if(firma===DB.respaldoFirma) return;
  const d=DB.perfil.resp.datos||{};
  try{ if(await rpcCuenta("guardar_usuario",{p_nombre:d.nombre||null, p_apellido:d.apellido||null, p_anon_id:DB.anonId, p_respaldo:resp}, keepalive)){ DB.respaldoFirma=firma; persist(); } }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden) subirRespaldo(true); });
// Junta los registros de dos copias (por ejemplo, la de la cuenta y la de un dispositivo que ya tenía datos).
function unirDias(a,b){
  const out=JSON.parse(JSON.stringify(a||{}));
  for(const [k,d] of Object.entries(b||{})){ const o=out[k]||(out[k]={comidas:[],ejercicio:[],sueno:null});
    for(const f of ["comidas","ejercicio"]){ const ids=new Set((o[f]||[]).map(x=>x.id)); o[f]=(o[f]||[]).concat((d[f]||[]).filter(x=>!ids.has(x.id))); }
    if(!o.sueno && d.sueno) o.sueno=d.sueno; }
  return out;
}
async function alIngresar(j){
  guardarSesion(j);
  let u=null; try{ u=await rpcCuenta("mi_usuario"); }catch(e){}
  const r=u?.respaldo||{};
  if(r.perfil?.completo){
    const mismaCuenta = DB.cuentaId===DB.auth.user.id && DB.perfil?.completo;
    if(!mismaCuenta){ DB.perfil=r.perfil; if(r.consent) DB.consent=r.consent; }
    DB.dias=unirDias(r.dias, DB.dias);
    if(u.anon_id) DB.anonId=u.anon_id;
    if(r.secret){ DB.secret=r.secret; secretHash=null; }
  }
  DB.cuentaId=DB.auth.user.id; DB.respaldoFirma=null; persist();
  ONB.paso=null; ONB.draft=null; INGRESO.paso="mail"; INGRESO.msg="";
  if(DB.perfil?.completo){ ONB.soloDatos=!DB.perfil.resp.datos?.nombre; ONB.i=ONB.soloDatos? 0 : PREGUNTAS.length; } else ONB.i=0;
  render(); window.scrollTo(0,0); respaldoPronto(true);
}
// Ingreso por enlace: mientras el mail de Supabase traiga un enlace en lugar del código (hasta configurar un servidor
// de envío propio), el enlace vuelve a la app con la sesión en la dirección (#access_token=…).
async function ingresoPorEnlace(){
  if(!/(access_token|error_code)=/.test(location.hash)) return;
  const p=new URLSearchParams(location.hash.slice(1)); history.replaceState(null,"",location.pathname);
  if(p.get("error_code")){ INGRESO.paso="mail"; INGRESO.msg="El enlace venció o ya se usó. Pedí uno nuevo."; ONB.paso="ingreso"; render(); return; }
  try{ const at=p.get("access_token");
    const res=await fetch(AUTH_URL()+"/user",{headers:{"apikey":CONFIG.SUPABASE_ANON_KEY,"Authorization":"Bearer "+at}});
    if(!res.ok) throw 0;
    await alIngresar({access_token:at, refresh_token:p.get("refresh_token"), expires_in:+p.get("expires_in")||3600, user:await res.json()});
  }catch(e){ INGRESO.paso="mail"; INGRESO.msg="No se pudo entrar con ese enlace. Pedí uno nuevo."; ONB.paso="ingreso"; render(); }
}
function trasInstalar(){ if(DB.auth){ ONB.paso=null; ONB.i=0; } else ONB.paso="ingreso"; renderOnb(); window.scrollTo(0,0); }

// ---- Pantalla de ingreso ----
const INGRESO={paso:"mail", email:"", msg:"", enviadoEn:0};
async function pedirCodigo(email){
  try{ const r=await authPost("/otp?redirect_to="+encodeURIComponent(location.origin+location.pathname),{email, create_user:true});

function keyShift(key, days){ const [y,m,dd]=key.split("-").map(Number); const x=new Date(y,m-1,dd+days,12); return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()); }

function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return Math.abs(h); }

// ==== PLAN PERSONALIZADO ====
function ans(id){ return DB.perfil?.resp?.[id]; }
function has(id,v){ const a=ans(id); return Array.isArray(a)? a.includes(v) : a===v; }
function calcPlan(p){
  const r=p.resp; const edad=+r.cuerpo?.edad||25, alt=+r.cuerpo?.altura||170, peso=+r.cuerpo?.peso||70;
  const care = edad<18 || r.relacion==="control" || r.relacion==="tca";
  const s = r.sexo==="h"? 5 : r.sexo==="m"? -161 : -78;
  const bmr = 10*peso + 6.25*alt - 5*edad + s;
  const fa = {sed:1.2, lig:1.375, mod:1.55, alt:1.725}[r.actividad] || 1.375;
  let kcal = bmr*fa;
  const obj = r.objetivo;
  if(obj==="bajar" && !care) kcal = Math.max(kcal*0.85, bmr*1.1);
  if(obj==="ganar") kcal *= 1.10;
  kcal = Math.round(kcal/50)*50;
  const protKg = (obj==="bajar"||obj==="ganar") ? 1.6 : 1.0;
  const excl = new Set();
  const pat=r.patron;
  if(pat==="veg"||pat==="vegano") ["vacuna","cerdo","pollo","pescado"].forEach(g=>excl.add(g));
  if(pat==="vegano") ["huevo","lacteo"].forEach(g=>excl.add(g));
  for(const x of (r.restric||[])){ if(x==="gluten") excl.add("gluten"); if(x==="nuez") excl.add("nuez"); if(x==="huevo") excl.add("huevo"); }
  for(const x of (r.nocome||[])){ if(["pescado","cerdo","legumbre","lacteo"].includes(x)) excl.add(x); }
  if(r.pan==="no") excl.add("pan");
  let eq = new Set((r.equipo||[]).filter(x=>x!=="otro")); if(!eq.size) eq=new Set(["hornalla"]);
  const tmax = r.tiempo==="15"?15 : r.tiempo==="30"?30 : r.tiempo==="60"?60 : r.tiempo==="tandas"?60 : 40;
  const est = ESTRUCTURAS[r.estructura] ? r.estructura : "damc";
  const hAlm = +r.hAlm || 13, hCen = +r.hCen || 21;
  const horas = {des:"8:30", col:"10:30", alm:hAlm+":00", mer:Math.round((hAlm+hCen)/2)+":00", cen:hCen+":00"};
  const diasMov = +r.dias || 3;
  return { care, edad, peso, kcal, prot:Math.round(peso*protKg), excl, eq, tmax, est, horas,
    pan: PANES[r.pan] || PANES.generico, sinLactosa:(r.restric||[]).includes("lactosa"),
    metas:{frutas:2, verduras:3, integrales:excl.has("gluten")?2:3, nueces:excl.has("nuez")?0:1, rojaSem:2, movMin:150, fuerza:2, sueno:7},
    flex: pat==="flex", diasMov, budget:r.presupuesto, platos:r.platos||[], prefMov:(r.mov||[]).filter(x=>x!=="otro") };
}
let PLAN = null;

// ==== RECETAS: aplicar el pan elegido y filtrar por perfil ====
function ingOf(id){ if(id==="pan" && PLAN){ return {...ING.pan, ...PLAN.pan, g:["gluten"], pan:true}; } return ING[id]; }
function escala(x,f){ if(f>1 && x.fijo) return 1; if(f>1 && x.pr) return Math.min(f,1.15); return f; }
function nutr(rec, factor){
  factor = factor || 1;
  let k=0,p=0,fib=0,veg=0,fruta=0,integ=0,nuez=false,vitC=false,roja=false,atun=false;
  for(const [id,g,esc] of rec.i){
    const x=ingOf(id); const gg = esc ? g*escala(x,factor) : g;
    k+=x.k*gg/100; p+=x.p*gg/100; fib+=x.f*gg/100;
    if(x.veg) veg+=gg; if(x.fruta) fruta+=gg; if(x.integral) integ+=gg;
    if(x.nuez && gg>=15) nuez=true; if(x.vitC && gg>=60) vitC=true; if(x.roja) roja=true; if(x.atun) atun=true;
  }
  return {kcal:Math.round(k), prot:Math.round(p), fibra:Math.round(fib),
    verduras:Math.round(veg/VEG_PORCION*2)/2, frutas:Math.round(fruta/FRUTA_PORCION*2)/2, integrales:Math.round(integ/INT_PORCION*2)/2,
    nueces:nuez?1:0, vitC, roja, atun};
}
function usable(rec){
  if(!PLAN) return true;
  for(const [id] of rec.i){ const x=ING[id]; if(id==="pan" && PLAN.excl.has("pan")) return false; for(const g of (x.g||[])) if(PLAN.excl.has(g)) return false; }
  for(const req of rec.eq){ if(!req.split("|").some(e=>PLAN.eq.has(e))) return false; }
  if(rec.t>PLAN.tmax) return false;
  return true;
}
function recetasDe(pool){ const all=RECETAS.filter(r=>r.s===pool); const u=all.filter(usable); return u.length? u : all.filter(r=>{ for(const [id] of r.i){ for(const g of (ING[id].g||[])) if(PLAN && PLAN.excl.has(g)) return false; } return true; }); }

// ==== ESTADO DEL DÍA ====
const S = { today: dayKey(new Date()), slot:null, offsets:{}, adj:{}, view:"hoy" };
function day(k){ k=k||S.today; if(!DB.dias[k]) DB.dias[k]={comidas:[], ejercicio:[], sueno:null}; const d=DB.dias[k]; d.comidas=d.comidas||[]; d.ejercicio=d.ejercicio||[]; return d; }
function slotsHoy(){ return ESTRUCTURAS[PLAN.est].slots; }
function slotNow(){
  const h=new Date().getHours()+new Date().getMinutes()/60; const sl=slotsHoy().map(s=>s[0]);
  const hr = k=>{ const [a,b]=PLAN.horas[k].split(":").map(Number); return a+b/60; };
  if(h<4) return sl[sl.length-1];
  let best=sl[0]; for(const k of sl){ if(h >= hr(k)-1.5) best=k; } return best;
}
function totals(comidas){
  const t={kcal:0,prot:0,fibra:0,verduras:0,frutas:0,integrales:0,nueces:0,vitC:false,roja:0,atun:0,sinEstimar:0};
  for(const c of comidas||[]){ if(c.kcal==null){ t.sinEstimar++; continue; }
    t.kcal+=c.kcal; t.prot+=c.prot||0; t.fibra+=c.fibra||0; t.verduras+=c.verduras||0; t.frutas+=c.frutas||0; t.integrales+=c.integrales||0;
    t.nueces+=c.nueces||0; if(c.vitC) t.vitC=true; if(c.roja) t.roja++; if(c.atun) t.atun++; }
  return t;
}
function last7(){ return Array.from({length:7},(_,i)=>keyShift(S.today,i-6)); }
function weekCount(field){ let n=0; for(const k of last7()) for(const c of (DB.dias[k]?.comidas||[])) if(c[field]) n++; return n; }
function exKcal(k){ return (day(k).ejercicio||[]).reduce((a,e)=>a+(e.kcal||0),0); }

function slotShare(slot){ return (slotsHoy().find(s=>s[0]===slot)||[0,.25])[1]; }

// ==== ELECCIÓN DE RECETA ====
function candidatos(slot){
  const pool=SLOTDEF[slot].pool; let base=recetasDe(pool);
  const rojaOk = weekCount("roja") < PLAN.metas.rojaSem, atunOk = weekCount("atun") < 3;
  const recientes=new Set(); for(const k of [keyShift(S.today,-2),keyShift(S.today,-1),S.today]) for(const c of (DB.dias[k]?.comidas||[])) if(c.recetaId) recientes.add(c.recetaId);
  let f = base.filter(r=>{ const n=nutr(r); return !(n.roja&&!rojaOk) && !(n.atun&&!atunOk) && !recientes.has(r.id); });
  if(!f.length) f = base.filter(r=>{ const n=nutr(r); return !(n.roja&&!rojaOk) && !(n.atun&&!atunOk); });
  if(!f.length) f = base;
  const score = r => (PLAN.platos.includes(r.tipo)?2:0) + (PLAN.budget==="ajustado" && r.cost<=1 ? 1:0) - (PLAN.flex && nutr(r).roja ? 1:0)
    + (!totals(day().comidas).vitC && pool!=="p" && nutr(r).vitC ? 2:0);
  return f.slice().sort((a,b)=> score(b)-score(a) || a.id.localeCompare(b.id));
}
function elegir(slot){
  const f=candidatos(slot); if(!f.length) return {rec:null, count:0};
  const top=f.filter((r,i)=>i<Math.max(3,Math.ceil(f.length/2)));
  const base=hash(S.today+slot)%top.length; const off=S.offsets[slot]||0;
  const list = off<top.length ? top : f;
  return {rec:list[(base+off)%list.length], count:f.length};
}
function fitFactor(rec, kcalObj){ let best=1, d=Infinity; for(let f=0.6; f<=1.8001; f+=0.05){ const k=nutr(rec,f).kcal; if(Math.abs(k-kcalObj)<d){ d=Math.abs(k-kcalObj); best=Math.round(f*100)/100; } } return best; }
function factorFor(slot, rec){
  let obj = PLAN.kcal*slotShare(slot);
  const ultimo = slotsHoy()[slotsHoy().length-1][0];
  let why="";
  if(slot===ultimo && exKcal()>0){ obj += exKcal(); why=`Porción un poco más grande por tu actividad de hoy.`; }
  return {f:fitFactor(rec,obj), why};
}

// ==== SINCRONIZACIÓN CON LA BASE COMÚN (Supabase) ====
const SYNC_ON = () => !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && DB.consent?.share);
let secretHash=null;
async function getHash(){
  if(secretHash) return secretHash;
  try{ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(DB.secret)); secretHash=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ secretHash="h"+hash(DB.secret).toString(16); }
  return secretHash;
}
function perfilCompartible(){
  const r={...DB.perfil.resp}; if(r.relacion==="control"||r.relacion==="tca") r.relacion="no_informado"; delete r.relacion_otro; delete r.datos;
  r.tiempos_s = DB.perfil.tiempos||{}; return r;
}
function enviar(tipo, datos, fecha, urgente){
  if(!DB.consent?.share) return;
  DB.cola.push({tipo, fecha: fecha||S.today, datos, creado:new Date().toISOString()}); persist();
  if(urgente) flush(true); else flushSoon();
}
let flushT=null, flushing=false;
function flushSoon(){ clearTimeout(flushT); flushT=setTimeout(flush, 1500); }
async function flush(urgente){
  if(flushing || !SYNC_ON() || !DB.cola.length || !navigator.onLine) return;
  flushing=true;
  try{
    const tk = DB.auth? await tokenVigente() : CONFIG.SUPABASE_ANON_KEY; if(!tk){ flushing=false; return; }
    const h=await getHash(); const lote=DB.cola.slice(0, urgente? 20 : 200);
    const rows=lote.map(e=>({anon_id:DB.anonId, secret_hash:h, tipo:e.tipo, fecha:e.fecha, datos:e.datos, creado:e.creado, app_version:CONFIG.APP_VERSION}));
    const res=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/eventos",{method:"POST", keepalive:!!urgente,
      headers:{"apikey":CONFIG.SUPABASE_ANON_KEY,"Authorization":"Bearer "+tk,"Content-Type":"application/json","Prefer":"return=minimal"},
      body:JSON.stringify(rows)});
    if(res.ok){ DB.cola.splice(0,lote.length); persist(); if(DB.cola.length) flushSoon(); }
  }catch(e){}
  flushing=false;
}

// ==== SESIONES DE USO ====
// Una sesión va desde que la app se abre (o vuelve al frente) hasta que pasa a segundo plano o se cierra.
// Si vuelve en menos de un minuto, sigue la misma sesión. Se envía cada vez que la app pasa a segundo plano,
// con el mismo id: para analizar, vale el último envío de cada id.
const SES_PAUSA=60000;
function sesionEnviar(s, urgente){
  enviar("sesion",{id:s.id, inicio:new Date(s.inicio).toISOString(), fin:new Date(s.fin).toISOString(), duracion_s:Math.round((s.fin-s.inicio)/1000)}, dayKey(new Date(s.inicio)), urgente);
}
function sesionIniciar(){
  const ahora=Date.now(), s=DB.sesion;
  if(s && s.fin && ahora-s.fin<SES_PAUSA){ s.fin=null; s.ultimo=ahora; persist(); return; }
  if(s && !s.fin){ s.fin=s.ultimo||s.inicio; sesionEnviar(s); }   // se cerró sin aviso: termina en su último registro
  DB.sesion={id:uid(), inicio:ahora, ultimo:ahora, fin:null}; persist();
}
function sesionPausar(){ const s=DB.sesion; if(!s || s.fin) return; s.fin=s.ultimo=Date.now(); persist(); sesionEnviar(s, true); }
document.addEventListener("visibilitychange",()=>{ if(document.hidden) sesionPausar(); else sesionIniciar(); });
window.addEventListener("pagehide", sesionPausar);
setInterval(()=>{ if(DB.sesion && !DB.sesion.fin && !document.hidden){ DB.sesion.ultimo=Date.now(); persist(); } }, 30000);

  const prog=el("div",{class:"onb-prog"}, el("i",{style:`width:${(ONB.i/total)*100}%`}));
  const card=el("div",{class:"onb-card"}, prog, el("div",{class:"eyebrow"},`${q.sec} · ${ONB.i+1} de ${total}`), el("h2",{},q.t), q.sub? el("p",{class:"note"},q.sub):null);
  const otroIn=el("input",{type:"text",id:"q-"+q.id+"-otro",placeholder:"Escribilo",value:R[q.id+"_otro"]||""}); otroIn.addEventListener("input",()=>{ R[q.id+"_otro"]=otroIn.value; ok(); });
  otroIn.addEventListener("blur",()=>ok());
  const sig=el("button",{class:"btn primary",type:"button",onclick:next},"Siguiente");
  let tocado=false;
  const ok=()=>{ let v=R[q.id];
    if(q.type==="datos"){ const d=R.datos||{}; sig.disabled = !(d.nombre && d.apellido && EMAIL_RE.test(d.email||"")); return; }
    if(q.type==="numbers"){ const c=R.cuerpo||{}; sig.disabled = !q.fields.every(([k,,,mn,mx])=>+c[k]>=mn && +c[k]<=mx); return; }
    const conOtro = Array.isArray(v)? v.includes("otro") : v==="otro";
    otroWrap.hidden=!conOtro;
    sig.disabled = q.type==="multi" ? !(v&&v.length) || (conOtro && !otroIn.value.trim()) : !v || (conOtro && !otroIn.value.trim());
    if(q.type==="multi"){ if(tocado && !sig.disabled && document.activeElement!==otroIn) cuentaIniciar(next); else cuentaParar(); } };
  const otroWrap=el("div",{class:"otro-wrap"}, otroIn);
  const nav=(...extra)=>el("div",{class:"row onb-nav"}, ONB.i>0? el("button",{class:"btn ghost",type:"button",onclick:atras},"Atrás"):null, ...extra, sig);
  if(q.type==="datos"){
    R.datos=R.datos||{}; if(DB.auth?.user?.email) R.datos.email=DB.auth.user.email;
    const campos=[["nombre","Nombre","text","given-name"],["apellido","Apellido","text","family-name"],["email","Mail","email","email"]];
    card.append(el("div",{class:"campos"}, campos.map(([k,lab,tipo,ac])=>{
      const inp=el("input",{type:tipo,id:"q-"+k,autocomplete:ac,value:R.datos[k]||"",autocapitalize:tipo==="email"?"off":"words",inputmode:tipo==="email"?"email":false,spellcheck:"false",readonly:tipo==="email" && !!DB.auth});
      inp.addEventListener("input",()=>{ R.datos[k]=inp.value.trim(); ok(); });
      return el("label",{class:"campo",for:"q-"+k}, el("span",{},lab), inp); })));
    card.append(nav()); box.append(card); ok(); return;
  }
  if(q.type==="numbers"){
    R.cuerpo=R.cuerpo||{};
    card.append(el("div",{class:"nums"}, q.fields.map(([k,lab,un,mn,mx])=>{ const inp=el("input",{type:"number",id:"q-"+k,inputmode:"decimal",min:String(mn),max:String(mx),value:R.cuerpo[k]??""});
      inp.addEventListener("input",()=>{ R.cuerpo[k]=inp.value; ok(); });
      return el("label",{class:"num",for:"q-"+k}, el("span",{},lab), el("span",{class:"numrow"}, inp, el("small",{},un))); })));
    card.append(nav()); box.append(card); ok(); return;
  }
  const opts=el("div",{class:"choices"});
  const draw=()=>{ opts.replaceChildren(...q.opts.concat([["otro","Otro"]]).map(([v,t])=>{
    const sel = q.type==="multi" ? (R[q.id]||[]).includes(v) : R[q.id]===v;
    return el("button",{type:"button",class:"choice"+(sel?" on":""),"aria-pressed":String(sel),onclick:()=>{
      if(q.type==="multi"){ let a=(R[q.id]||[]).slice(); if(a.includes(v)) a=a.filter(x=>x!==v); else a.push(v); R[q.id]=a; tocado=true; draw(); ok(); }
      else { R[q.id]=v; draw(); ok(); if(v!=="otro") setTimeout(next,160); else otroIn.focus(); } }}, t); })); };
  draw();
  card.append(opts, otroWrap, nav(q.type==="multi" ? el("button",{class:"btn ghost",type:"button",onclick:()=>{ R[q.id]=[]; next(); }},"Ninguna") : null));
  box.append(card); ok();
}
// Términos y condiciones: obligatorios para entrar, al final del cuestionario.
function renderConsent(box){
  const aviso=el("div",{class:"aviso-tyc",role:"alert",hidden:!ONB.rechazo},"Para usar Pulso tenés que aceptar los términos y condiciones. Mientras no los aceptes, no podés entrar.");
  box.append(el("div",{class:"onb-card"}, el("div",{class:"onb-prog"}, el("i",{style:"width:100%"})),
    el("div",{class:"eyebrow"},"Último paso"), el("h2",{},"Términos y condiciones"),
    el("p",{},"¿Aceptás los términos y condiciones de Pulso?"),
    el("details",{class:"rec"}, el("summary",{},el("span",{},"Leer los términos y condiciones")), terminos()),
    aviso,
    el("button",{class:"btn primary big",type:"button",onclick:()=>{ ONB.rechazo=false; finalizarCuestionario(); }},"Acepto"),
    el("button",{class:"btn ghost",type:"button",onclick:()=>{ ONB.rechazo=true; aviso.hidden=false; aviso.scrollIntoView({block:"center",behavior:"smooth"}); }},"No acepto"),
    DB.perfil?.completo? null : el("button",{class:"btn link",type:"button",onclick:()=>{ ONB.rechazo=false; ONB.i--; renderOnb(); }},"Atrás")));
}
function finalizarCuestionario(){
  const ahora=new Date().toISOString();
  const tiempos=Object.fromEntries(Object.entries(ONB.tiempos).map(([k,v])=>[k, Math.round(v/100)/10]));
  DB.perfil={resp:ONB.draft||DB.perfil.resp, completo:true, actualizado:ahora, creado:DB.perfil?.creado||ahora, tiempos};
  if(!DB.consent?.acepta) DB.consent={acepta:true, share:true, fecha:ahora, version:CONFIG.APP_VERSION};
  ONB.draft=null; ONB.i=-1; ONB.tiempos={}; S.view="hoy"; S.slot=null; persist();
  enviar("perfil", perfilCompartible());
  respaldoPronto(true);
  if(DB.avisos?.on) sincronizarAvisos(); else if(!DB.avisoOfrecido && estadoAvisos()==="off") ONB.paso="avisos";
  render(); window.scrollTo(0,0);
}

{ const m=new URLSearchParams(location.search).get("momento"); if(m && SLOTDEF[m]){ S.slot=m; S.view="hoy"; } if(location.search) history.replaceState(null,"",location.pathname+location.hash); }
sesionIniciar();
render();
ingresoPorEnlace();
flushSoon();
sincronizarAvisos();
setInterval(()=>{ const k=dayKey(new Date()); if(k!==S.today){ S.today=k; S.slot=null; S.offsets={}; render(); } },60000);

</script>
