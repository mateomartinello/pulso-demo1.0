<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F5F0E8">
<title>Pulso</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="iconos/icon-192.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pulso">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: una columna (máx. 720px); cuestionario inicial de una pregunta por pantalla; luego pestañas Hoy / Movimiento / Semana / Historial / Recetario / Perfil. */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Sin zoom: nada de doble toque; los campos con 16 px para que el iPhone no agrande la página al tocarlos. */
html{touch-action:manipulation} input,textarea,select{font-size:16px!important}
:root{
  --bg:#F5F0E8; --box:#E8E0D0; --card:#FBF8F2; --ink:#1C2018; --body:#3A3E2E; --muted:#5A5E4A;
  --green:#4A5C42; --gold:#C8C4A0; --ok:#3F6B3A; --ok-bg:#DCE6D3; --warn:#8A5A12; --warn-bg:#F1E3C4; --bad:#7A2E22; --bad-bg:#F1DCD5;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171A14;--box:#22271E;--card:#1D2119;--ink:#ECE6D8;--body:#D2CCBC;--muted:#A3A08C;--green:#8AA27E;--gold:#4F4C38;
  --ok:#A9CC9F;--ok-bg:#26381F;--warn:#E6C27A;--warn-bg:#3D3016;--bad:#F0A898;--bad-bg:#4A2219;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171A14;--box:#22271E;--card:#1D2119;--ink:#ECE6D8;--body:#D2CCBC;--muted:#A3A08C;--green:#8AA27E;--gold:#4F4C38;
  --ok:#A9CC9F;--ok-bg:#26381F;--warn:#E6C27A;--warn-bg:#3D3016;--bad:#F0A898;--bad-bg:#4A2219;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-inline:18px;padding-block:22px 64px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:clamp(26px,6vw,34px);line-height:1.1;margin:.2em 0 0;text-wrap:balance}
.date{font-size:13.5px;color:var(--muted)}
.tabs{overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;margin:16px 0 18px;border-bottom:1px solid var(--gold)}
.tab{font:inherit;font-size:14px;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.slot:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:16px}
.slots{display:flex;flex-wrap:wrap;gap:6px}   /* fijo: los momentos del día pasan de renglón en lugar de deslizarse */
.slot{flex:0 0 auto;font:inherit;font-size:12.5px;background:var(--card);color:var(--body);border:1px solid var(--gold);border-radius:999px;padding:6px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.slot[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slot .ck{font-weight:700;color:var(--ok)} .slot[aria-pressed="true"] .ck{color:var(--bg)}
.card{background:var(--card);border:1px solid var(--gold);border-radius:8px;padding:18px}
.hero{border-top:3px solid var(--ink)}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h2{font-family:var(--serif);font-size:23px;line-height:1.2;color:var(--ink);margin:6px 0 4px;text-wrap:balance}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin:0 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--muted)}
.factor{display:inline-block;background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:600;border-radius:4px;padding:2px 8px;margin-top:8px}
.ing{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--gold)}
.ing li{display:contents}
.ing span{padding:7px 0;border-bottom:1px solid var(--gold);font-size:14px}
.ing span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;padding-left:12px;white-space:nowrap}
.ing small{color:var(--muted);font-weight:400}
ol.steps{margin:14px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:6px;padding:9px 14px;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.small{font-size:13px;padding:6px 10px}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--gold);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;background:var(--card);color:var(--body);border:0;border-right:1px solid var(--gold);padding:8px 10px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--bg)}
.actions{margin-top:16px;padding-top:14px;border-top:1px solid var(--gold);display:flex;flex-direction:column;gap:10px}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pi{background:var(--card);border:1px solid var(--gold);border-radius:6px;padding:10px 12px;min-width:0}
.pi .v{font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pi .v small{font-size:12px;font-weight:500;color:var(--muted)}
.pi .k{font-size:12px;color:var(--muted)}
.bar{height:5px;background:var(--box);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.pi.done{border-color:var(--ok)} .pi.done .bar i{background:var(--ok)}
.pi.over{border-color:var(--warn)} .pi.over .bar i{background:var(--warn)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--gold);font-size:14px;align-items:flex-start}
.log li > div{min-width:0}
.log .s{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.x{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
textarea,input[type=number],select{font:inherit;color:var(--body);background:var(--card);border:1px solid var(--gold);border-radius:6px;padding:8px 10px}
textarea{width:100%;min-height:64px;resize:vertical}
input[type=number]{width:90px}
.ex{background:var(--warn-bg);border-color:var(--warn)}
.ex h3{color:var(--warn)}
.banner{background:var(--box);border-left:3px solid var(--warn);padding:10px 12px;font-size:13.5px}
.det{font-size:12.5px;color:var(--muted);margin-top:2px}
.det.warn{color:var(--warn)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--gold);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.ok{color:var(--ok);font-weight:600} td.low{color:var(--bad)} td.hi{color:var(--warn);font-weight:600}
.rgroup{display:flex;flex-direction:column;gap:10px}
details.rec{background:var(--card);border:1px solid var(--gold);border-radius:6px;padding:10px 14px}
details.rec summary{cursor:pointer;font-weight:600;color:var(--ink);list-style:none;display:flex;justify-content:space-between;gap:10px}
details.rec summary::-webkit-details-marker{display:none}
details.rec summary span:last-child{font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11px;font-weight:600;border-radius:4px;padding:2px 7px;background:var(--box);color:var(--body)}
.tag.r{background:var(--bad-bg);color:var(--bad)} .tag.c{background:var(--ok-bg);color:var(--ok)}
.sep{height:1px;background:var(--gold);margin:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


.btn.ghost{border-color:var(--gold);color:var(--muted)}
.btn.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:6px 0;font-weight:500}
.btn.big{font-size:16px;padding:13px 18px;width:100%}
.volver{align-self:flex-start;font:inherit;font-size:15px;font-weight:600;color:var(--muted);background:none;border:0;padding:4px 0;margin:-6px 0 -4px;cursor:pointer}
.volver:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.barra-sup{display:flex;justify-content:space-between;align-items:center;margin:-6px 0 -4px}
.barra-sup .volver{margin:0}
.btn.link.admin-link{font-size:13px;padding:4px 0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:inherit;font-size:13.5px;background:var(--card);color:var(--body);border:1px solid var(--gold);border-radius:999px;padding:7px 12px;cursor:pointer}
.opt.on{background:var(--green);border-color:var(--green);color:var(--bg)}
.opt:focus-visible,.choice:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#onb{max-width:560px;margin:0 auto;padding-inline:18px;padding-block:28px 64px}
.onb-card{display:flex;flex-direction:column;gap:14px}
.onb-card h1{font-size:clamp(34px,9vw,46px)}
.onb-card h2{font-size:26px;margin:0}
.lead{font-family:var(--serif);font-size:20px;color:var(--ink);margin:0;text-wrap:balance}
.onb-prog{height:2px;background:var(--gold);overflow:hidden}
.onb-prog i{display:block;height:100%;background:#fff;transition:width .25s}
#cuenta{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:5px;background:var(--box);z-index:40}
#cuenta i{display:block;height:100%;width:0;background:var(--green)}
.campos{display:flex;flex-direction:column;gap:12px}
.campo{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.campo input{font:inherit;font-size:16px;font-weight:400;color:var(--body);background:var(--card);border:1px solid var(--gold);border-radius:6px;padding:11px 12px}
.campo input:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.enlace-baja{margin:4px 0 0;text-align:center;font-size:12.5px} .enlace-baja a{color:var(--muted)}
.btn.peligro{background:var(--bad);border-color:var(--bad);color:var(--bg)}
#baja-resp{width:100%;font:inherit;font-size:16px;color:var(--body);background:var(--card);border:1px solid var(--gold);border-radius:6px;padding:10px 12px}
#carga{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#carga svg{width:64px;height:64px}
#carga .fondo{fill:var(--box)}
#carga .torta{fill:none;stroke:var(--green);stroke-width:30;stroke-dasharray:94.25;stroke-dashoffset:94.25;transform:rotate(-90deg);transform-origin:32px 32px}
#carga p{margin:0;color:var(--muted);font-size:14px}
.confirmar{display:flex;flex-direction:column;gap:10px;align-items:stretch;border-top:1px solid var(--gold);padding-top:12px}
.confirmar-preg{margin:0;font-weight:600;color:var(--ink)}
.btn.mantener{position:relative;overflow:hidden;border-color:var(--bad);color:var(--bad);background:transparent;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mantener-barra{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--bad-bg)}
.mantener-txt{position:relative;font-weight:700}
.aviso-tyc{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:12px 14px;font-weight:500}
.btn-perfil{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.btn-perfil svg{width:22px;height:22px}
.btn-perfil[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-perfil:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.top{align-items:flex-start;flex-wrap:nowrap}
.top .date{margin-top:4px}
.tarjeta{touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.tarjeta .btn{user-select:none}
.marcas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.marcas li{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.marcas select{width:58%}
.guia{position:relative;background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 14px;margin-bottom:4px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:14px}
.guia p{margin:0}
.guia::after{content:"";position:absolute;left:24px;bottom:-7px;width:14px;height:14px;background:var(--ink);transform:rotate(45deg)}
.guia .btn{border-color:var(--bg);color:var(--bg)}
.codigo{font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}
.subpasos{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.choice-det{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.sheet-card.preguntas{gap:14px}
.menu-perfil{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--gold);border-radius:8px;overflow:hidden}
.menu-perfil button{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--gold);padding:15px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;text-align:left}
.menu-perfil button:last-child{border-bottom:0}
.menu-perfil button:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.botones-marcas .btn{flex:1;font-size:15px;padding:12px}
.btn.guardar{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.btn.cancelar{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.pasos-vis{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.paso-vis{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:12px}
.paso-vis p{margin:0 0 8px}
.paso-n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700}
.ico{display:inline-grid;place-items:center;width:24px;height:24px;color:var(--muted)} .ico svg{width:22px;height:22px}
.ico.grande{width:36px;height:36px} .ico.grande svg{width:30px;height:30px}
.ico.resalta{color:#0A84FF;border-radius:8px;box-shadow:0 0 0 2px #0A84FF;padding:2px;width:30px;height:30px}
.mock{border:1px solid var(--gold);border-radius:10px;background:var(--box);padding:8px 12px;display:flex;align-items:center;gap:14px;max-width:300px}
.mock.barra{justify-content:space-between}
.mock-url{font-size:13px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mock.menu{justify-content:space-between;font-size:15px;color:var(--ink)}
.mock.boton{justify-content:flex-end} .resalta-txt{color:#0A84FF;font-weight:700;border-radius:6px;box-shadow:0 0 0 2px #0A84FF;padding:2px 8px}
.mock.inicio{flex-direction:column;align-items:flex-start;gap:4px;font-size:12px;color:var(--ink);width:max-content}
.mock.inicio img{border-radius:13px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{font:inherit;font-size:15px;text-align:left;background:var(--card);color:var(--body);border:1px solid var(--gold);border-radius:8px;padding:13px 14px;cursor:pointer}
.choice.on{border-color:var(--green);background:var(--ok-bg);color:var(--ink);font-weight:600}
.choice.ninguna{background:var(--box);border-color:var(--muted);font-weight:600}
.choice.ninguna.on{border-color:var(--green);background:var(--ok-bg)}
.otro-wrap input,#emoOtro{width:100%}
input[type=text]{font:inherit;color:var(--body);background:var(--card);border:1px solid var(--gold);border-radius:6px;padding:10px 12px}
.onb-nav{justify-content:space-between;margin-top:4px}
.nums{display:flex;flex-direction:column;gap:12px}
.num{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--gold);border-radius:8px;padding:10px 14px}
.numrow{display:flex;align-items:center;gap:8px}
.numrow input{width:100px;font-size:16px}
.checks{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.legal{font-size:13px;color:var(--body)} .legal p{margin:8px 0}
.ideas{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
#sheet{position:fixed;inset:0;background:rgba(20,22,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
.sheet-card{background:var(--bg);border-radius:12px;padding:18px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet-card h2{margin:0}
.pasos-inst{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.aviso-inst{margin:0;background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px}
@media (prefers-reduced-motion:reduce){.onb-prog i{transition:none}}

</style>
</head>
<body>

<div id="onb" hidden></div>
<div id="app" hidden>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">Comer · moverte · descansar</div>
      <h1>Pulso</h1>
      <div class="date" id="fecha"></div>
    </div>
    <button type="button" id="btnPerfil" class="btn-perfil" aria-label="Perfil" title="Perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c0-4.2 3.6-6.5 8-6.5s8 2.3 8 6.5"/></svg></button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="hoy">Hoy</button>
    <button class="tab" role="tab" data-v="mov">Movimiento</button>
    <button class="tab" role="tab" data-v="semana">Semana</button>
    <button class="tab" role="tab" data-v="historial">Historial</button>
    <button class="tab" role="tab" data-v="recetario">Recetario</button>
  </div>
  <div id="storeBanner" class="banner" hidden>Este navegador no está guardando tus datos (modo privado o almacenamiento bloqueado). Lo que registres se pierde al cerrar.</div>
  <div id="v-hoy" class="stack"></div>
  <div id="v-mov" class="stack" hidden></div>
  <div id="v-semana" class="stack" hidden></div>
  <div id="v-historial" class="stack" hidden></div>
  <div id="v-recetario" class="stack" hidden></div>
  <div id="v-perfil" class="stack" hidden></div>
</div>
</div>
<div id="cuenta" hidden aria-hidden="true"><i></i></div>
<div id="carga" hidden role="status" aria-live="polite"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="fondo" cx="32" cy="32" r="30"/><circle class="torta" cx="32" cy="32" r="15"/></svg><p id="cargaTxt"></p></div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Hambre y emociones"></div>

      const x={n, k:+k, p:+p, f:+f, por:+por||100, u:+u||0, uN:uN||"", hc:0, gr:0, v:0, fr:0, ig:0, nz:false, c:false, r:false, a:false, l:false, F:false, P:false, b:false, B:false, cnt:0};
      for(const t of fl.trim().split(/\s+/).filter(Boolean)){
        const m=t.match(/^([a-zA-Z]+)=?([\d.]*)$/); if(!m) continue; const [,key,val]=m;
        if(key==="v") x.v=val?+val:1; else if(key==="f") x.fr=val?+val:1; else if(key==="i") x.ig=val?+val:1;
        else if(key==="n") x.nz=true; else if(key==="c") x.c=true; else if(key==="r") x.r=true; else if(key==="a") x.a=true;
        else if(key==="l") x.l=true; else if(key==="F") x.F=true; else if(key==="P") x.P=true; else if(key==="b") x.b=true; else if(key==="B") x.B=true;
        else if(key==="gr") x.gr=+val; else if(key==="hc") x.hc=+val;
        else if(key==="cnt") x.cnt=+val; else if(key==="M") x.M=true; else if(key==="T") x.T=true; else if(key==="S") x.S=true;
      }
      x.id=foods.length; foods.push(x);
      const seen=new Set();
      for(const a of (al+";"+n).split(";")){ const tk=toks(a).map(o=>o.t); const key=tk.join(" "); if(!key||seen.has(key)) continue; seen.add(key); alias.push({tk, food:x}); }
    }
    return {foods, alias};
  }

  // Sabores: después de un alimento marcado S («barrita de chocolate y naranja»), no suman otro alimento.
  const SABORES = new Set(["chocolate","naranja","frutilla","limon","vainilla","banana","coco","menta","mani","almendra","avellana","cereza","durazno",
    "manzana","arandano","fruto","rojo","dulce","leche","crema","cookie","caramelo","maracuya","mango","anana","nuez","pistacho","cafe","miel","frambuesa"]);
  let DB=null, BYFIRST=null, VOCAB=null, BYNAME=null;
  const INTEG = {"Fideos":"Fideos integrales","Arroz":"Arroz integral","Pan blanco":"Pan integral","Pan lactal":"Pan integral","Wrap":"Rapidita integral","Galletitas de agua":"Galletitas integrales","Pizza":"Pizza integral","Galletitas dulces":"Galletitas integrales"};
  function init(txt){
    DB=parseDB(txt); BYFIRST=new Map(); VOCAB=new Set(); BYNAME={};
    for(const a of DB.alias){ const k=a.tk[0]; if(!BYFIRST.has(k)) BYFIRST.set(k,[]); BYFIRST.get(k).push(a); for(const t of a.tk) VOCAB.add(t); }
    for(const l of BYFIRST.values()) l.sort((x,y)=>y.tk.length-x.tk.length);
    for(const f of DB.foods) BYNAME[f.n]=f;
    for(const w of [...STOP,...ADJ,...FRITO,...Object.keys(UNIT),...Object.keys(SIZE),...Object.keys(NUM)]) VOCAB.add(sing(w));
    return DB;
  }

  // ---- corrección de errores de tipeo (distancia de edición) ----
  function lev(a,b,max){
    if(Math.abs(a.length-b.length)>max) return max+1;
    let prev=Array.from({length:b.length+1},(_,i)=>i), pp=null;
    for(let i=1;i<=a.length;i++){ const cur=[i]; let best=i;
      for(let j=1;j<=b.length;j++){ let v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
        if(pp && i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) v=Math.min(v,pp[j-2]+1);
        cur.push(v); if(v<best) best=v; }
      if(best>max) return max+1; pp=prev; prev=cur; }
    return prev[b.length];
  }
  const fixCache=new Map();
  function fix(t){
    if(VOCAB.has(t) || t.length<4 || /\d/.test(t)) return t;
    if(fixCache.has(t)) return fixCache.get(t);
    const max = t.length>=8?2:1; let best=t, bd=max+1;
    for(const w of VOCAB){ if(w.length<3) continue; const d=lev(t,w,max); if(d<bd || (d===bd && best!==t && Math.abs(w.length-t.length)<Math.abs(best.length-t.length))){ bd=d; best=w; } }
    const r = bd<=max? best : t; fixCache.set(t,r); return r;
  }

  function numOf(o){
    if(!o) return null; const r=o.raw;
    if(/^\d+(\.\d+)?$/.test(r)) return parseFloat(r);
    if(/^\d+\/\d+$/.test(r)){ const [a,b]=r.split("/").map(Number); return b? a/b : null; }
    if(/^x\d+(\.\d+)?$/.test(r)) return parseFloat(r.slice(1));
    if(Object.prototype.hasOwnProperty.call(NUM,r)) return NUM[r];
    return undefined;
  }
  const isNum = o => { const n=numOf(o); return n!==undefined; };

  function analizar(texto){
    if(!DB) throw new Error("Tabla no cargada");
    const T = toks(texto).map(o=>({...o, t:fix(o.t)}));
    const used = new Array(T.length).fill(false);
    const items=[];
    // 1) buscar alimentos (la coincidencia más larga primero)
    for(let i=0;i<T.length;i++){
      if(used[i]) continue;
      if(T[i].t==="sopa" && i>0 && (/^cuchar/.test(T[i-1].t) || (T[i-1].raw==="|" && i>1 && /^cuchar/.test(T[i-2].t)))){ used[i]=true; T[i].puente=true; continue; }   // «tres cucharas sopas» (dictado de «cucharadas soperas»)
      const prev=items[items.length-1];
      if(prev && ADJ.has(T[i].t)){ let k=i-1; while(k>=prev.e && (STOP.has(T[k].t)||STOP.has(T[k].raw)) && !["con","y","e","o","mas"].includes(T[k].raw)) k--;
        if(k+1===prev.e) continue; }   // «arroz (Gallo) tostado»: adjetivo, no el sándwich «tostado»
      const list=BYFIRST.get(T[i].t)||[];
      let hit=null, hitEnd=i, talla=1;
      // un tamaño puede ir en medio del nombre: «milanesa mediana de pollo»
      for(const a of list){ let j=i, k=0, ok=true, tl=1, saltos=0;
        while(k<a.tk.length){ if(j>=T.length || used[j]){ ok=false; break; }
          if(T[j].t===a.tk[k]){ j++; k++; continue; }
          if(k>0 && SIZE[T[j].raw]!==undefined && saltos<2){ tl*=SIZE[T[j].raw]; saltos++; j++; continue; }
          ok=false; break; }
        if(ok){ hit=a; hitEnd=j; talla=tl; break; } }
      if(i>0 && isNum(T[i-1]) && items.length){
        // "3 empanadas de carne y 2 de pollo": primero probar con el plato anterior
        const h=items[items.length-1].head; const alt=(BYFIRST.get(h)||[]).find(a=> a.tk.length>1 && i+a.tk.length-1<=T.length && a.tk.slice(1).every((t,j)=>T[i+j].t===t && !used[i+j]));
        if(alt && (!hit || alt.tk.length-1>=hit.tk.length)){ const end=i+alt.tk.length-1; for(let j=i;j<end;j++) used[j]=true; items.push({food:alt.food, s:i, e:end, head:h}); i=end-1; continue; }
      }
      if(!hit) continue;
      let end=hitEnd; for(let j=i;j<end;j++) used[j]=true;
      if(hit.food.S && end<T.length && SABORES.has(T[end].t)){   // sabores: «de chocolate y naranja»
        while(end<T.length && !used[end] && (SABORES.has(T[end].t) || (T[end].raw==="y" && end+1<T.length && SABORES.has(T[end+1].t)))){ used[end]=true; end++; } }
      items.push({food:hit.food, s:i, e:end, head:hit.tk[0], al:hit.tk.length, tk:hit.tk, sz0:talla}); i=end-1;
    }
    // 2) cantidades alrededor de cada alimento
    const free = k => k>=0 && k<T.length && !used[k];
    const inicios = new Set(items.map(x=>x.s));
    const pesoPuro = u => u && u.g && !u.u && !u.p && !u.un;
    for(const it of items){
      it.num=null; it.unit=null; it.size=it.sz0||1; it.frito=false; it.neg=false; it.gExp=null; it.integral=false;
      let j=it.s-1, guard=0; const nums=[];
      while((free(j) || (j>=0 && T[j].puente)) && guard++<6){
        const o=T[j]; if(o.puente){ j--; continue; }
        if(o.raw==="|" && j>0 && isNum(T[j-1])){ used[j]=true; j--; continue; }   // «Tres. Croquetas» (dictado): el número sigue valiendo
        if(o.raw==="sin"){ it.neg=true; used[j]=true; break; }
        if(SIZE[o.raw]!==undefined && !UNIT[o.t]){ it.size*=SIZE[o.raw]; used[j]=true; j--; continue; }
        if(UNIT[o.t] && it.unit==null && !isNum(o)){ it.unit=UNIT[o.t]; it.unitW=o.t; used[j]=true; j--; continue; }
        if(isNum(o)){ const n=numOf(o); if(n!=null) nums.push(n); used[j]=true; j--; continue; }
        break;
      }
      if(nums.length) it.num = nums.reduce((a,b)=>a*b,1);
      let k=it.e; guard=0;
      while(free(k) && guard++<5){
        const o=T[k];
        if(o.t==="integral"){ it.integral=true; used[k]=true; k++; continue; }
        if(ADJ.has(o.t) || ADJ.has(o.raw)){ used[k]=true; k++; continue; }
        if(FRITO.has(o.raw)||FRITO.has(o.t)){ it.frito=true; used[k]=true; k++; continue; }
        if(SIZE[o.raw]!==undefined){ it.size*=SIZE[o.raw]; used[k]=true; k++; continue; }
        if(/^x\d/.test(o.raw)){ it.num=numOf(o); used[k]=true; k++; continue; }
        if((o.raw==="como"||o.raw==="aprox"||o.raw==="aproximadamente"||o.raw==="unos"||o.raw==="unas") && T[k+1] && isNum(T[k+1])){ used[k]=true; k++; continue; }
        if(isNum(o) && numOf(o)!=null && T[k+1] && UNIT[T[k+1].t] && !(inicios.has(k+2) && T[k+2].de)){   // «… ¼ de lata de garbanzos»: esa cantidad es del alimento que sigue
          const u=UNIT[T[k+1].t];
          if(pesoPuro(u)) it.gExp=numOf(o)*u.g; else { it.num=numOf(o); it.unit=u; it.unitW=T[k+1].t; }
          used[k]=used[k+1]=true; k+=2; continue; }
        break;
      }
    }
    // cantidades sueltas ("pizza con amigos, 4 porciones"): van al alimento anterior que no tenía cantidad
    for(let i=0;i<T.length-1;i++){
      if(used[i] || used[i+1] || !isNum(T[i]) || numOf(T[i])==null || !UNIT[T[i+1].t]) continue;
      const prev = items.filter(it=> it.e<=i && i-it.e<=6 && it.num==null && it.gExp==null).pop();
      if(!prev) continue;
      const u=UNIT[T[i+1].t]; if(pesoPuro(u)) prev.gExp=numOf(T[i])*u.g; else { prev.num=numOf(T[i]); prev.unit=u; prev.unitW=T[i+1].t; }
      used[i]=used[i+1]=true;
    }
    for(const it of items){
      if(it.integral && INTEG[it.food.n] && BYNAME[INTEG[it.food.n]]) it.food=BYNAME[INTEG[it.food.n]];
      const f=it.food; const unit=it.unit, num=it.num;
      let g;
      if(it.gExp!=null) g=it.gExp;
      else if(pesoPuro(unit)) g=(num==null?1:num)*unit.g;
      else {
        let base;
        const uMatch = unit && f.u && (unit.u || (unit.un && f.uN && sing(norm(f.uN))===unit.un));
        if(uMatch) base=f.u;
        else if(unit && unit.p) base=f.por*unit.p;
        else if(unit && unit.g) base=unit.g;
        else if(num!=null) base = f.cnt || f.u || f.por;
        else base = f.por;
        g = (num==null?1:num)*base;
      }
      g *= it.size;
      it.g = Math.max(1, Math.round(g)); it.frito = it.frito && !f.F;
    }
    // el mismo alimento nombrado dos veces seguidas ("una bocha de helado", "galletitas oreo") cuenta una vez
    for(let i=items.length-1;i>0;i--){ const a=items[i-1], b=items[i]; if(a.food===b.food && b.s-a.e<=1){ if(b.num!=null && a.num==null){ a.g=b.g; } items.splice(i,1); } }
    // listas del tipo «Tomate ½ tomate chico» o «Milanesa de pollo ¼ de una milanesa»: encabezado y después la cantidad, sin «y» ni «con» en el medio
    const conCant = it => it.num!=null || it.gExp!=null || it.unit!=null || (it.size||1)!==1;
    for(let i=items.length-1;i>0;i--){ const a=items[i-1], b=items[i];
      const entre=T.slice(a.e,b.s), aclara=entre.some(o=>["aproximadamente","aprox","osea"].includes(o.raw));   // «2 pedacitos, aproximadamente ½ boniato»
      if(!(a.food===b.food || (a.head===b.head && (b.al||1)===1)) || b.s-a.e>5 || (conCant(a) && !aclara)) continue;
      if(entre.some(o=>["y","e","con","mas"].includes(o.raw))) continue;
      a.g = a.food===b.food? b.g : Math.max(1, Math.round(b.g/(b.food.u||b.food.por)*(a.food.u||a.food.por)));
      a.e=b.e; items.splice(i,1); }
    // panes seguidos («rebanada de pan lactal Fargo negro»): vale el más específico, con la cantidad del primero
    for(let i=items.length-1;i>0;i--){ const a=items[i-1], b=items[i];
      if(!(a.food.b && b.food.b) || b.s-a.e>1 || a.food===b.food) continue;
      a.g=Math.max(1, Math.round(a.g/(a.food.u||a.food.por)*(b.food.u||b.food.por))); a.food=b.food; a.e=b.e; items.splice(i,1); }
    // 3) reglas de combinación
    let out = items.filter(i=>!i.neg);
    // si algo ya trae pan (hamburguesa, pancho, sándwich), no se suma "pan" aparte cerca
    for(const p of out.filter(i=>i.food.P)){
      out = out.filter(i=> i===p || !(i.food.b && !i.food.B && Math.abs(i.s-p.s)<=8));
    }
    // lo que ya trae leche (licuado, café con leche) no suma "leche" aparte cerca
    for(const p of out.filter(i=>i.food.M)){ out = out.filter(i=> i===p || !(i.food.n==="Leche" && Math.abs(i.s-p.s)<=5)); }
    // relleno de sándwiches, tostados, wraps y tacos: porción de relleno, no de plato
    for(const c of out.filter(i=>i.food.B)){
      const fx = Math.min(Math.max(c.g/80, 0.75), 1.2);
      for(const i of out){ if(i===c || i.food.b || i.food.l || i.s<=c.s || i.s-c.e>6 || i.num!=null || i.gExp!=null || T.slice(c.e,i.s).some(o=>o.raw==="|")) continue;
        if(i.food.u && i.food.u===i.food.por) continue;
        i.g = Math.max(5, Math.round(Math.min(i.g,80)*fx)); }
    }
    // coberturas de pizzas y hamburguesas ("pizza con tomate", "hamburguesa con lechuga y tomate"): unas rodajas, no la porción entera
    const COBERTURA = new Set(["Aceitunas","Jamón cocido","Jamón crudo","Queso","Cheddar","Mozzarella","Panceta","Palta","Champiñones"]);
    for(const c of out.filter(i=>i.food.T)){
      const tope = Math.min(150, Math.round(25*Math.max(1, c.g/(c.food.u||c.g))));
      for(const i of out){ if(i===c || i.s<=c.s || i.s-c.e>6 || i.num!=null || i.gExp!=null || i.food.l || i.food.T) continue;
        if(i.food.v>=1 || i.food.fr>=1 || COBERTURA.has(i.food.n)) i.g = Math.min(i.g, tope); }
    }
    // panes que se rellenan (sándwich, tostado, wrap) sin relleno nombrado: relleno típico
    const extra=[];
    for(const c of out.filter(i=>i.food.B)){
      const relleno = out.some(i=> i!==c && !i.food.b && i.s>c.s && i.s-c.e<=6 && !i.food.l && !T.slice(c.e,i.s).some(o=>o.raw==="|"));
      if(!relleno){
        const k = c.g / (c.food.u||c.g);
        extra.push({food:BYNAME["Jamón cocido"], g:Math.round(40*k), s:c.s, auto:true});
        extra.push({food:BYNAME["Queso"], g:Math.round(30*k), s:c.s, auto:true});
      }
    }
    // "ensalada" suelta: si dice de qué, cuenta el aderezo; si no, ensalada mixta
    for(let i=0;i<T.length;i++){
      if(used[i] || T[i].t!=="ensalada") continue;
      used[i]=true;
      const nombrados = out.filter(x=> x.s>i && x.s-i<=7 && x.food.v>=1);
      if(nombrados.length){ extra.push({food:BYNAME["Aceite"], g:8, s:i, auto:true, nota:"aderezo"}); }
      else extra.push({food:BYNAME["Ensalada mixta"], g:200, s:i});
    }
    out = out.concat(extra).sort((a,b)=>a.s-b.s);
    // el mismo relleno nombrado dos veces cerca de un plato armado («sándwich de jamón y queso con jamón»): cuenta una vez
    for(const c of out.filter(i=>i.food.B||i.food.P)){
      const vistos=new Set();
      out = out.filter(i=>{ if(i===c || i.s<=c.s || i.s-c.e>12 || i.auto) return true;
        if(vistos.has(i.food) && i.num==null && i.gExp==null) return false; vistos.add(i.food); return true; });
    }
    // 4) no reconocido
    const sobras=[];
    for(let i=0;i<T.length;i++){ if(used[i]) continue; const o=T[i];
      if(STOP.has(o.t)||STOP.has(o.raw)||ADJ.has(o.t)||FRITO.has(o.raw)||UNIT[o.t]||SIZE[o.raw]!==undefined||isNum(o)||o.raw.length<=2) continue;
      sobras.push(o.raw); }
    // 5) totales
    const t=calcular(out);
    t.items = out.map(it=>({n:it.food.n, g:it.g, l:it.food.l, u:it.food.u, uN:it.food.uN, por:it.food.por, k:it.food.k, auto:!!it.auto, nota:it.nota||"",
      frito:!!it.frito, integral:!!it.integral, alias:(it.tk||[]).join(" "),
      explicita: it.num!=null || it.gExp!=null || it.unit!=null || (it.size||1)!==1,
      relleno: !!(it.food.B && out.some(x=>x.auto && x.s===it.s))}));   // sándwich, tostado o wrap sin relleno nombrado
    t.sobras=sobras;
    return t;
  }
  function calcular(out){
    let kcal=0,prot=0,carb=0,grasa=0,fibra=0,veg=0,fru=0,integ=0,nuez=0,vitC=false,roja=false,atun=false;
    for(const it of out){ const f=it.food, g=it.g;
      kcal+=f.k*g/100 + (it.frito? g*0.5 : 0); prot+=f.p*g/100; fibra+=f.f*g/100;
      carb+=f.hc*g/100; grasa+=f.gr*g/100 + (it.frito? g*0.5/9 : 0);   // frito: el aceite absorbido suma grasa
      veg+=g*f.v; fru+=g*f.fr; integ+=g*(it.integral && f.b ? Math.max(f.ig,1) : f.ig); if(f.nz) nuez+=g; if(f.c && g>=60) vitC=true; if(f.r) roja=true; if(f.a) atun=true; }
    return {
      kcal:Math.round(kcal), prot:Math.round(prot), carb:Math.round(carb), grasa:Math.round(grasa), fibra:Math.round(fibra),
      verduras:Math.round(veg/80*2)/2, frutas:Math.round(fru/150*2)/2, integrales:Math.round(integ/30*2)/2,
      nueces: nuez>=15?1:0, vitC, roja, atun
    };
  }
  // Recalcula una comida a partir de ítems [{n, g, frito, integral}] (después de las preguntas de porción e ingredientes).
  function totales(items){
    const out=items.filter(it=>BYNAME[it.n]).map(it=>({...it, food:BYNAME[it.n]}));
    const t=calcular(out); t.items=items; return t;
  }
  function describir(it){
    const unidad = it.l? "ml":"g";
    if(it.u && it.u>=20 && !it.l){ const n=it.g/it.u; if(Math.abs(n-Math.round(n))<0.01 && n>=1 && n<=24){
      const un=it.uN||""; const base=norm(it.n).split(" ")[0];
      if(!un || un==="unidad" || sing(norm(un))===sing(base)) return n===1? it.n : `${it.n} ×${n}`;
      return `${it.n} (${n} ${n===1?un:plural(un)})`; } }
    return `${it.n} ${it.g} ${unidad}`;
  }
  function plural(w){ if(/[aeiouáéí]$/.test(w)) return w+"s"; if(w.endsWith("z")) return w.slice(0,-1)+"ces"; if(w.endsWith("ón")) return w.slice(0,-2)+"ones"; if(w.endsWith("án")) return w.slice(0,-2)+"anes"; return w+"es"; }
  return {init, analizar, totales, describir, alimento:n=>BYNAME[n], norm, _toks:toks};
})();

// ==== RECORDATORIOS DE COMIDAS (Web Push) ====
// Independientes de «compartir datos»: usan un código propio (DB.avisos.id), distinto de DB.anonId.
const TXT_DATOS_AVISOS = "Para enviarlos guardamos en nuestro servidor la dirección de notificaciones de este dispositivo, los horarios de tus comidas y qué comidas ya registraste (no qué comiste), con un código aparte, que no se vincula con tu cuenta. Podés desactivarlos cuando quieras desde Perfil.";
const TXT_BLOQUEADO = "Las notificaciones de Pulso están bloqueadas en este dispositivo. Para activarlas: en iPhone, Configuración › Notificaciones › Pulso; en Android, si la instalaste, mantené apretado el ícono de Pulso › Información de la app › Notificaciones, y si la usás en Chrome, tocá el ícono junto a la dirección › Permisos › Notificaciones.";
const AVISOS_OK = () => !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && CONFIG.VAPID_PUBLICA) && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function estadoAvisos(){
  if(DB.avisos?.on) return "on";
  if(ES_IOS && !EN_INICIO()) return IOS_VIEJO? "viejo" : "instalar";
  if(!AVISOS_OK()) return "no";
  return Notification.permission==="denied" ? "bloqueado" : "off";
}
function b64u(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); return Uint8Array.from(atob(s+"===".slice((s.length+3)%4)), c=>c.charCodeAt(0)); }
async function rpc(fn, body){
  const res=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{"apikey":CONFIG.SUPABASE_ANON_KEY,"Authorization":"Bearer "+CONFIG.SUPABASE_ANON_KEY,"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if(!res.ok) throw new Error(fn+" "+res.status);
  return res.json();
}
// Recordatorios: solo los momentos que acepta el servidor (des, col, alm, mer, cen); la segunda colación y el entreno no avisan.
const MOMENTOS_AVISO=["des","col","alm","mer","cen"];
// Plan para los avisos: el actual o, durante el registro (antes de los términos), el que surge de las respuestas.
function planAvisos(){ return PLAN || calcPlan(DB.perfil?.completo? DB.perfil : {resp: ONB.draft || DB.perfil?.resp || {}}); }
function horariosAvisos(){ const P=planAvisos(); return Object.fromEntries(P.slots.filter(([k])=>MOMENTOS_AVISO.includes(k)).map(([k])=>[k, P.horas[k].padStart(5,"0")])); }
function zonaAvisos(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || "America/Argentina/Buenos_Aires"; }catch(e){ return "America/Argentina/Buenos_Aires"; } }
function listaHorarios(){ const P=planAvisos(); const xs=P.slots.filter(([k])=>MOMENTOS_AVISO.includes(k)).map(([k])=>`${SLOTDEF[k].n.toLowerCase()} (${P.horas[k]} h)`); return xs.length>1? xs.slice(0,-1).join(", ")+" y "+xs[xs.length-1] : xs[0]; }

async function guardarSuscripcion(sub){
  const j=sub.toJSON(), horarios=horariosAvisos(), zona=zonaAvisos();
  const ok=await rpc("guardar_suscripcion",{p_id:DB.avisos.id, p_secret:DB.avisos.secret, p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_horarios:horarios, p_zona:zona});
  if(!ok) throw new Error("rechazada");
  DB.avisos.firma=JSON.stringify([j.endpoint,horarios,zona]); persist();
}
async function suscripcionPush(){
  const reg=await navigator.serviceWorker.ready; let sub=await reg.pushManager.getSubscription();
  if(sub && DB.avisos?.vapid && DB.avisos.vapid!==CONFIG.VAPID_PUBLICA){ await sub.unsubscribe(); sub=null; }
  return sub || reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(CONFIG.VAPID_PUBLICA)});
}
// Devuelve null si se activaron; si no, el mensaje para mostrar. El permiso se pide primero, dentro del toque (lo exige iPhone).
async function activarAvisos(){
  if(!AVISOS_OK()) return "Este navegador no permite notificaciones.";
  let perm; try{ perm=await Notification.requestPermission(); }catch(e){ perm="default"; }
  if(perm!=="granted") return perm==="denied"? TXT_BLOQUEADO : "No se activaron los recordatorios.";
  try{
    const sub=await suscripcionPush();
    DB.avisos={cola:[], ...(DB.avisos||{}), id:DB.avisos?.id||uid(), secret:DB.avisos?.secret||uid()+uid(), on:true, vapid:CONFIG.VAPID_PUBLICA}; persist();
    await guardarSuscripcion(sub);
    for(const c of day().comidas) marcarAviso(S.today, c.slot, true);
    return null;
  }catch(e){ if(DB.avisos){ DB.avisos.on=false; persist(); } return "No se pudieron activar los recordatorios. Revisá la conexión y probá de nuevo."; }
}
async function desactivarAvisos(){
  try{ const sub=await (await navigator.serviceWorker.ready).pushManager.getSubscription(); if(sub) await sub.unsubscribe(); }catch(e){}
  if(DB.avisos?.id){ try{ await rpc("borrar_suscripcion",{p_id:DB.avisos.id, p_secret:DB.avisos.secret}); }catch(e){} }
  DB.avisos={...(DB.avisos||{}), on:false, firma:null, cola:[]}; persist();
}
// Al abrir la app: si cambió la suscripción, los horarios o la zona horaria, se actualizan en el servidor.
async function sincronizarAvisos(){
  if(!DB.avisos?.on || !AVISOS_OK() || !DB.perfil?.completo) return;
  if(Notification.permission==="denied"){ await desactivarAvisos(); return; }
  try{ const sub=await suscripcionPush(); const j=sub.toJSON();
    if(JSON.stringify([j.endpoint,horariosAvisos(),zonaAvisos()])!==DB.avisos.firma) await guardarSuscripcion(sub); }catch(e){}
  enviarMarcas();
}
// «Esta comida ya está registrada»: solo la fecha y el momento del día, sin el contenido.
function marcarAviso(fecha, momento, hecho){
  if(!DB.avisos?.on) return;
  DB.avisos.cola=(DB.avisos.cola||[]).filter(m=>!(m.f===fecha && m.m===momento)); DB.avisos.cola.push({f:fecha, m:momento, h:hecho}); persist(); enviarMarcas();
}
let marcando=false;
async function enviarMarcas(){
  if(marcando || !DB.avisos?.on || !DB.avisos.cola?.length || !navigator.onLine) return;
  marcando=true;
  try{ while(DB.avisos.cola.length){ const x=DB.avisos.cola[0];
    await rpc("marcar_comida",{p_id:DB.avisos.id, p_secret:DB.avisos.secret, p_fecha:x.f, p_momento:x.m, p_hecho:x.h});
    DB.avisos.cola.shift(); persist(); } }catch(e){}
  marcando=false;
}
window.addEventListener("online", ()=>enviarMarcas());

// ==== CUENTA: ingreso con código por mail (Supabase Auth) y respaldo de los datos ====
// La persona entra con su mail y un código de 6 dígitos (Supabase Auth › Email › Email OTP length) (no con un enlace: en iPhone, el enlace se abriría en Safari
// y no en la app de la pantalla de inicio). La tabla «usuarios» guarda una copia de sus respuestas y registros.
const AUTH_URL = () => CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/auth/v1";
async function authPost(ruta, body, token){
  const res=await fetch(AUTH_URL()+ruta,{method:"POST",
    headers:{"apikey":CONFIG.SUPABASE_ANON_KEY,"Content-Type":"application/json",...(token?{"Authorization":"Bearer "+token}:{})}, body:JSON.stringify(body||{})});
  let j=null; try{ j=await res.json(); }catch(e){}
  return {ok:res.ok, status:res.status, j};
}
function guardarSesion(j){
  DB.auth={access_token:j.access_token, refresh_token:j.refresh_token, expira:Date.now()+(j.expires_in||3600)*1000,
    user:{id:j.user?.id||DB.auth?.user?.id, email:(j.user?.email||DB.auth?.user?.email||"").toLowerCase()}};
  persist();
}
let renovando=null;
async function tokenVigente(){
  if(!DB.auth) return null;
  if(Date.now() < DB.auth.expira-60000) return DB.auth.access_token;
  if(!renovando) renovando=(async()=>{
    try{ const r=await authPost("/token?grant_type=refresh_token",{refresh_token:DB.auth.refresh_token});
      if(r.ok){ guardarSesion(r.j); return DB.auth.access_token; }
      if(r.status>=400 && r.status<500){ DB.auth=null; persist(); render(); }   // sesión vencida: vuelve a pedir el mail; los datos del dispositivo quedan
      return null;
    }catch(e){ return null; } finally{ renovando=null; } })();
  return renovando;
}
async function rpcCuenta(fn, body, keepalive){
  const tk=await tokenVigente(); if(!tk) throw new Error("sin sesión");
  const res=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/rpc/"+fn,{method:"POST", keepalive:!!keepalive,
    headers:{"apikey":CONFIG.SUPABASE_ANON_KEY,"Authorization":"Bearer "+tk,"Content-Type":"application/json"}, body:JSON.stringify(body||{})});
  if(!res.ok) throw new Error(fn+" "+res.status);
  return res.json();
}

// ---- Respaldo: copia del perfil y los registros en la cuenta (se sube sola, unos segundos después de cada cambio) ----
let respaldoT=null;
function respaldoPronto(ya){ clearTimeout(respaldoT); respaldoT=setTimeout(()=>subirRespaldo(), ya?0:4000); }
async function subirRespaldo(keepalive){
  if(!DB.auth || !DB.perfil?.completo || !DB.consent?.acepta || !navigator.onLine) return;
  const resp={perfil:DB.perfil, dias:DB.dias, consent:DB.consent, secret:DB.secret, marcas:DB.marcas||{}};
  const firma=String(hash(JSON.stringify(resp))); if(firma===DB.respaldoFirma) return;

  try{ if(await rpcCuenta("guardar_usuario",{p_nombre:d.nombre||null, p_apellido:d.apellido||null, p_anon_id:DB.anonId, p_respaldo:resp}, keepalive)){ DB.respaldoFirma=firma; persist(); } }catch(e){}

// Junta los registros de dos copias (por ejemplo, la de la cuenta y la de un dispositivo que ya tenía datos).
function unirDias(a,b){
  const out=JSON.parse(JSON.stringify(a||{}));
  for(const [k,d] of Object.entries(b||{})){ const o=out[k]||(out[k]={comidas:[],ejercicio:[],sueno:null});
    for(const f of ["comidas","ejercicio"]){ const ids=new Set((o[f]||[]).map(x=>x.id)); o[f]=(o[f]||[]).concat((d[f]||[]).filter(x=>!ids.has(x.id))); }
    if(!o.sueno && d.sueno) o.sueno=d.sueno; }
  return out;
}
async function alIngresar(j, op={}){
  guardarSesion(j);
  let u=null; try{ u=await rpcCuenta("mi_usuario"); }catch(e){}
  DB.admin = !!(op.admin || u?.admin);
  const r=u?.respaldo||{};
  if(r.perfil?.completo){
    const mismaCuenta = DB.cuentaId===DB.auth.user.id && DB.perfil?.completo;
    if(!mismaCuenta){ DB.perfil=r.perfil; if(r.consent) DB.consent=r.consent; }
    DB.dias=unirDias(r.dias, DB.dias);
    if(u.anon_id) DB.anonId=u.anon_id;
    if(r.secret){ DB.secret=r.secret; secretHash=null; }
    if(r.marcas) DB.marcas={...r.marcas, ...(DB.marcas||{})};
  }
  // Nombre y apellido: los de la cuenta si ya los tenía; si no, los que escribió al ingresar. El mail es siempre el de la cuenta.
  const escritos={nombre:INGRESO.nombre, apellido:INGRESO.apellido};
  const datosDe = d => ({nombre:d?.nombre||escritos.nombre, apellido:d?.apellido||escritos.apellido, email:DB.auth.user.email});
  DB.cuentaId=DB.auth.user.id; DB.respaldoFirma=null;
  ONB.draft=null; INGRESO.paso="mail"; INGRESO.msg="";
  if(DB.perfil?.completo){ DB.perfil.resp.datos=datosDe(DB.perfil.resp.datos); ONB.i=PREGUNTAS.length;
    ONB.paso = estadoAvisos()==="off"? "avisos" : null; }   // cuenta existente: ingreso → recordatorios → app
  else { ONB.draft={datos:datosDe(null)}; ONB.paso="bienvenida"; ONB.i=-1; }
  persist(); render(); window.scrollTo(0,0); respaldoPronto(true);
}
// Ingreso por enlace: mientras el mail de Supabase traiga un enlace en lugar del código (hasta configurar un servidor
// de envío propio), el enlace vuelve a la app con la sesión en la dirección (#access_token=…).
async function ingresoPorEnlace(){
  if(!/(access_token|error_code)=/.test(location.hash)) return;
  const p=new URLSearchParams(location.hash.slice(1)); history.replaceState(null,"",location.pathname);
  if(p.get("error_code")){ INGRESO.paso="mail"; INGRESO.msg="El enlace venció o ya se usó. Pedí uno nuevo."; ONB.paso="ingreso"; render(); return; }
  try{ const at=p.get("access_token");
    const res=await fetch(AUTH_URL()+"/user",{headers:{"apikey":CONFIG.SUPABASE_ANON_KEY,"Authorization":"Bearer "+at}});
    if(!res.ok) throw 0;
    await Promise.all([cargando(3000,"Entrando a tu cuenta…"), alIngresar({access_token:at, refresh_token:p.get("refresh_token"), expires_in:+p.get("expires_in")||3600, user:await res.json()})]); cerrarCarga();
  }catch(e){ INGRESO.paso="mail"; INGRESO.msg="No se pudo entrar con ese enlace. Pedí uno nuevo."; ONB.paso="ingreso"; render(); }
}

// ---- Pantalla de carga: un círculo que se llena en el sentido del reloj, desde arriba, en la duración exacta ----
let cargaT=null;
function cargando(ms, texto){
  const c=$("#carga"), t=c.querySelector(".torta");
  $("#cargaTxt").textContent=texto||""; c.hidden=false;
  t.style.transition="none"; t.style.strokeDashoffset="94.25"; void c.offsetWidth;
  t.style.transition=`stroke-dashoffset ${ms}ms linear`; t.style.strokeDashoffset="0";
  clearTimeout(cargaT); return new Promise(r=>{ cargaT=setTimeout(r, ms); });
}
function cerrarCarga(){ clearTimeout(cargaT); $("#carga").hidden=true; }

// ---- Botón que hay que mantener apretado: la barra se vacía de derecha a izquierda; si se suelta antes, se cancela ----
function botonMantener(texto, ms, alConfirmar){
  const barra=el("span",{class:"mantener-barra"});
  const b=el("button",{class:"btn mantener",type:"button"}, barra, el("span",{class:"mantener-txt"},texto));
  let t=null;
  const empezar=ev=>{ if(t) return; ev.preventDefault(); barra.style.transition=`width ${ms}ms linear`; barra.style.width="0%"; t=setTimeout(()=>{ t=null; alConfirmar(); }, ms); };
  const soltar=()=>{ if(!t) return; clearTimeout(t); t=null; barra.style.transition="width .2s ease-out"; barra.style.width="100%"; };
  b.addEventListener("pointerdown",empezar);
  for(const e of ["pointerup","pointerleave","pointercancel"]) b.addEventListener(e,soltar);
  b.addEventListener("keydown",ev=>{ if((ev.key===" "||ev.key==="Enter") && !ev.repeat) empezar(ev); });
  b.addEventListener("keyup",ev=>{ if(ev.key===" "||ev.key==="Enter") soltar(); });
  b.addEventListener("contextmenu",ev=>ev.preventDefault());
  return b;
}

const ATAJO_NOMBRE="Pulso Salud";

async function leerSalud(){
  if(saludLeyendo || !DB.auth || !DB.salud?.activo || !navigator.onLine) return;

    const dias={}; let periodo=null;
    const peso=+DB.perfil?.resp?.cuerpo?.peso||70;   // sin energía informada: se estima como actividad moderada (MET 5), igual que el registro manual
    for(const f of filas||[]){ dias[f.fecha]={pasos:f.pasos, entrenos:(Array.isArray(f.entrenos)?f.entrenos:[]).map(e=>{ const min=Math.round(+e.min||0); return {tipo:String(e.tipo||"Ejercicio").slice(0,40), inicio:e.inicio||null, min, kcal:Math.round(+e.kcal||0) || Math.round(4*peso*min/60)}; })};
      if(f.periodo && (!periodo || f.periodo>periodo)) periodo=f.periodo; }
    DB.salud={...DB.salud, dias, leido:Date.now()};

// ==== PLAN PERSONALIZADO ====
function ans(id){ return DB.perfil?.resp?.[id]; }
function has(id,v){ const a=ans(id); return Array.isArray(a)? a.includes(v) : a===v; }
function calcPlan(p){
  const r=p.resp; const edad=+r.cuerpo?.edad||25, alt=+r.cuerpo?.altura||170, peso=+r.cuerpo?.peso||70;
  // Modo cuidado (menores de 18 o relación difícil con la comida): la app no muestra calorías. Todo lo demás es igual.
  const care = edad<18 || r.relacion==="control" || r.relacion==="tca";
  const s = r.sexo==="h"? 5 : r.sexo==="m"? -161 : -78;
  const bmr = 10*peso + 6.25*alt - 5*edad + s;
  const fa = {sed:1.2, lig:1.375, mod:1.55, alt:1.725}[r.actividad] || 1.375;
  let kcal = bmr*fa;
  // Objetivos combinables: bajar −15 %, ganar +10 %; los dos juntos = recomposición (mantenimiento con proteína alta).
  const objs = objetivosDe(r), bajar=objs.includes("bajar"), ganar=objs.includes("ganar");
  if(bajar && !ganar) kcal = Math.max(kcal*0.85, bmr*1.1);
  if(ganar && !bajar) kcal *= 1.10;
  kcal = Math.round(kcal/50)*50;
  const protKg = (bajar||ganar) ? 1.6 : 1.0;
  const excl = new Set();
  const pat=r.patron;
  if(pat==="veg"||pat==="vegano") ["vacuna","cerdo","pollo","pescado"].forEach(g=>excl.add(g));
  if(pat==="vegano") ["huevo","lacteo"].forEach(g=>excl.add(g));
  for(const x of (r.restric||[])){ if(["gluten","mani","nuez","huevo","pescado","marisco"].includes(x)) excl.add(x); }
  for(const x of (r.nocome||[])){ if(["pescado","cerdo","legumbre","lacteo"].includes(x)) excl.add(x); }
  if(r.pan==="no" || (r.nocome||[]).includes("pan")) excl.add("pan");   // r.pan: pregunta de marcas de versiones anteriores
  let eq = new Set((r.equipo||[]).filter(x=>x!=="otro")); if(!eq.size) eq=new Set(["hornalla"]);
  const tmax = r.tiempo==="15"?15 : r.tiempo==="30"?30 : r.tiempo==="60"?60 : r.tiempo==="tandas"?60 : 40;
  const hm=h=>Math.floor(h)+":"+pad(Math.round((h%1)*60));
  const {slots, horas} = armarComidas(comidasDe(r), +r.hAlm || 13, +r.hCen || 21, hm);
  const hE=HORA_ENTRENO[r.entreno];
  if(hE){ horas.pre=hm(hE-1.5); horas.post=hm(hE+1.5); }   // antes: 1 h 30 min antes; después: al terminar (se supone 1 h de entreno)
  const habil=(r.cocina||[]).filter(x=>x!=="ninguna").length;
  const nivel = !r.cocina ? 3 : habil<=1 ? 1 : habil<=3 ? 2 : 3;   // recetas: 1 básicas · 2 intermedias · 3 todas
  const repetir = {repito:1, roto:3, nuevo:6}[r.variedad] || 3;     // días antes de volver a sugerir una receta
  return { care, edad, peso, kcal, prot:Math.round(peso*protKg), excl, eq, tmax, slots, horas, nivel, repetir, entrenoDias: hE? (r.entrenoDias||[]) : [],
    pan: PANES[DB.marcas?.pan] || PANES[r.pan] || PANES.generico, sinLactosa:(r.restric||[]).includes("lactosa"),
    metas:{grasaMin:Math.round(kcal*0.2/9), frutas:2, verduras:3, integrales:excl.has("gluten")?2:3, nueces:excl.has("nuez")?0:1, rojaSem:2, movMin:150, fuerza:2, sueno:7},
    flex: pat==="flex", budget:r.presupuesto, platos:r.platos||[], prefMov:(r.mov||[]).filter(x=>x!=="otro") };
}
let PLAN = null;
// Momentos del día a partir de las comidas marcadas. Si marcó «snacks»: colaciones en los huecos de más de 4 h (máx. 2, las de más espacio)
// o, si no hay huecos así, una en el hueco más largo. Reparto de energía proporcional a estos pesos.
const PESO_COMIDA = {des:.20, alm:.35, mer:.15, cen:.30, col:.08, col2:.08};
function armarComidas(lista, hAlm, hCen, hm){
  const horaDe = {des:8.5, alm:hAlm, cen:hCen, mer: lista.includes("alm")&&lista.includes("cen")? Math.round((hAlm+hCen)/2) : 17};
  let principales = ["des","alm","mer","cen"].filter(k=>lista.includes(k));
  if(!principales.length) principales=["des","alm","mer","cen"];
  principales.sort((a,b)=>horaDe[a]-horaDe[b]);
  const huecos=[]; for(let i=1;i<principales.length;i++){ const a=horaDe[principales[i-1]], b=horaDe[principales[i]]; huecos.push({ini:a, fin:b, len:b-a}); }
  huecos.sort((x,y)=>y.len-x.len);
  let cols = [];   // colaciones solo si marcó «Snacks entre comidas»
  if(lista.includes("snacks")){ cols = huecos.filter(h=>h.len>4).slice(0,2);
    if(!cols.length && huecos.length) cols=[huecos[0]];
    if(!huecos.length) cols=[{ini:horaDe[principales[0]], fin:horaDe[principales[0]]+5}]; }
  const horas={}; for(const k of principales) horas[k]=hm(horaDe[k]);
  cols.sort((x,y)=>x.ini-y.ini).forEach((h,i)=>{ horas[i? "col2":"col"]=hm(Math.round((h.ini+h.fin))/2); });
  const ks=Object.keys(horas).sort((a,b)=>{ const t=k=>{ const [x,y]=horas[k].split(":").map(Number); return x+y/60; }; return t(a)-t(b); });
  const total=ks.reduce((s,k)=>s+PESO_COMIDA[k],0);
  return {slots: ks.map(k=>[k, PESO_COMIDA[k]/total]), horas};
}

// ==== RECETAS: aplicar el pan elegido y filtrar por perfil ====
function ingOf(id){
  if(id==="pan" && PLAN){ return {...ING.pan, ...PLAN.pan, g:["gluten"], pan:true}; }
  const m=marcaDeIng(id); return m? {...ING[id], k:m.k, p:m.p, f:m.f, hc:m.hc, gr:m.gr} : ING[id];
}
function escala(x,f){ if(f>1 && x.fijo) return 1; if(f>1 && x.pr) return Math.min(f,1.15); return f; }
function nutr(rec, factor){
  factor = factor || 1;
  let k=0,p=0,hc=0,gr=0,fib=0,veg=0,fruta=0,integ=0,nuez=false,vitC=false,roja=false,atun=false;
  for(const [id,g,esc] of rec.i){
    const x=ingOf(id); const gg = esc ? g*escala(x,factor) : g;
    k+=x.k*gg/100; p+=x.p*gg/100; hc+=(x.hc||0)*gg/100; gr+=(x.gr||0)*gg/100; fib+=x.f*gg/100;
    if(x.veg) veg+=gg; if(x.fruta) fruta+=gg; if(x.integral) integ+=gg;
    if(x.nuez && gg>=15) nuez=true; if(x.vitC && gg>=60) vitC=true; if(x.roja) roja=true; if(x.atun) atun=true;
  }
  return {kcal:Math.round(k), prot:Math.round(p), carb:Math.round(hc), grasa:Math.round(gr), fibra:Math.round(fib),
    verduras:Math.round(veg/VEG_PORCION*2)/2, frutas:Math.round(fruta/FRUTA_PORCION*2)/2, integrales:Math.round(integ/INT_PORCION*2)/2,
    nueces:nuez?1:0, vitC, roja, atun};
}
function usable(rec){
  if(!PLAN) return true;
  for(const [id] of rec.i){ const x=ING[id]; if(id==="pan" && PLAN.excl.has("pan")) return false; for(const g of (x.g||[])) if(PLAN.excl.has(g)) return false; }
  for(const req of rec.eq){ if(!req.split("|").some(e=>PLAN.eq.has(e))) return false; }
  if(rec.t>PLAN.tmax) return false;
  if((rec.dif||1)>PLAN.nivel) return false;   // según lo que le sale bien cocinar
  return true;
}
function recetasDe(pool){ const all=RECETAS.filter(r=>r.s===pool); const u=all.filter(usable); return u.length? u : all.filter(r=>{ for(const [id] of r.i){ for(const g of (ING[id].g||[])) if(PLAN && PLAN.excl.has(g)) return false; } return true; }); }

// ==== ESTADO DEL DÍA ====
const S = { today: dayKey(new Date()), slot:null, offsets:{}, adj:{}, view:"hoy" };
function day(k){ k=k||S.today; if(!DB.dias[k]) DB.dias[k]={comidas:[], ejercicio:[], sueno:null}; const d=DB.dias[k]; d.comidas=d.comidas||[]; d.ejercicio=d.ejercicio||[]; return d; }
// Momentos del día: los de la estructura elegida y, los días de entreno (o después de registrar movimiento), antes y después de entrenar.
function slotsHoy(){
  const base=PLAN.slots.slice(), d=DB.dias[S.today];
  const entrena = PLAN.entrenoDias.includes(String(keyDate(S.today).getDay()));
  if(entrena) base.push(["pre",.08]);
  if(entrena || d?.postHora) base.push(["post",.10]);
  const hr=k=>{ const [a,b]=PLAN.horas[k].split(":").map(Number); return a+b/60; };
  return base.sort((x,y)=>hr(x[0])-hr(y[0]));
}
function slotNow(){
  const h=new Date().getHours()+new Date().getMinutes()/60; const sl=slotsHoy().map(s=>s[0]);
  const hr = k=>{ const [a,b]=PLAN.horas[k].split(":").map(Number); return a+b/60; };
  if(h<4) return sl[sl.length-1];
  let best=sl[0]; for(const k of sl){ if(h >= hr(k)-1.5) best=k; } return best;
}
function totals(comidas){
  const t={kcal:0,prot:0,carb:0,grasa:0,fibra:0,verduras:0,frutas:0,integrales:0,nueces:0,vitC:false,roja:0,atun:0,sinEstimar:0};
  for(const c of comidas||[]){ if(c.kcal==null){ t.sinEstimar++; continue; }
    t.kcal+=c.kcal; t.prot+=c.prot||0; t.carb+=c.carb||0; t.grasa+=c.grasa||0; t.fibra+=c.fibra||0; t.verduras+=c.verduras||0; t.frutas+=c.frutas||0; t.integrales+=c.integrales||0;
    t.nueces+=c.nueces||0; if(c.vitC) t.vitC=true; if(c.roja) t.roja++; if(c.atun) t.atun++; }
  return t;
}
function last7(){ return Array.from({length:7},(_,i)=>keyShift(S.today,i-6)); }
function weekCount(field){ let n=0; for(const k of last7()) for(const c of (DB.dias[k]?.comidas||[])) if(c[field]) n++; return n; }
function exKcal(k){ return (day(k).ejercicio||[]).reduce((a,e)=>a+(e.kcal||0),0) + (saludDia(k||S.today)?.entrenos||[]).reduce((a,e)=>a+(e.kcal||0),0); }
function target(){ return PLAN.kcal + exKcal(); }
function slotShare(slot){ return (slotsHoy().find(s=>s[0]===slot)||[0,.25])[1]; }

// ==== ELECCIÓN DE RECETA ====
function candidatos(slot){
  const pool=SLOTDEF[slot].pool; let base=recetasDe(pool);
  const rojaOk = weekCount("roja") < PLAN.metas.rojaSem, atunOk = weekCount("atun") < 3;
  const recientes=new Set(); for(let d=0; d<PLAN.repetir; d++) for(const c of (DB.dias[keyShift(S.today,-d)]?.comidas||[])) if(c.recetaId) recientes.add(c.recetaId);   // variedad: cada cuántos días se puede repetir
  let f = base.filter(r=>{ const n=nutr(r); return !(n.roja&&!rojaOk) && !(n.atun&&!atunOk) && !recientes.has(r.id); });
  if(!f.length) f = base.filter(r=>{ const n=nutr(r); return !(n.roja&&!rojaOk) && !(n.atun&&!atunOk); });
  if(!f.length) f = base;
  const gusto=gustosRegistrados();
  const score = r => (PLAN.platos.includes(r.tipo)?2:0) + (PLAN.budget==="ajustado" && r.cost<=1 ? 1:0) - (PLAN.flex && nutr(r).roja ? 1:0) + afinidad(r, gusto)
    + (!totals(day().comidas).vitC && pool!=="p" && nutr(r).vitC ? 2:0);
  return f.slice().sort((a,b)=> score(b)-score(a) || a.id.localeCompare(b.id));
}
// Lo que más registró en los últimos 30 días, por familia de alimento: sube en las sugerencias las recetas parecidas.
const FAMILIAS = {pollo:/pollo|pechuga|suprema/, vacuna:/carne|bife|asado|nalga|peceto|vacio|matambre/, cerdo:/cerdo|bondiola|solomillo/,
  pescado:/merluza|pescado|atun|salmon/, huevo:/huevo|clara|omelette|revuelto|tortilla/, legumbre:/garbanzo|lenteja|poroto|hummus/, tofu:/tofu|soja/,
  pasta:/fideo|pasta|raviol|noqui|tallarin|tirabuzon/, arroz:/arroz|risotto/, batata:/batata|boniato/, papa:/papa|pure/, palta:/palta/,
  yogur:/yogur/, avena:/avena|granola/, ricota:/ricota/, ensalada:/ensalada|lechuga|rucula/, milanesa:/milanesa/};
const FAM_ING = {pollo:"pollo", vacuna:"vacuna", cerdo:"cerdo", merluza:"pescado", atun:"pescado", huevo:"huevo", clara:"huevo", garbanzos:"legumbre",
  lentejas:"legumbre", hummus:"legumbre", tofu:"tofu", milaSoja:"tofu", fideosInt:"pasta", arrozInt:"arroz", batata:"batata", papa:"papa", palta:"palta",
  yogNat:"yogur", yogGriego:"yogur", avena:"avena", ricota:"ricota", lechuga:"ensalada", rucula:"ensalada", panRallado:"milanesa"};
let gustoCache=null;
function gustosRegistrados(){
  const clave=S.today+"|"+Object.keys(DB.dias).length; if(gustoCache?.clave===clave) return gustoCache.cuenta;
  const cuenta={};
  for(let d=0; d<30; d++) for(const c of (DB.dias[keyShift(S.today,-d)]?.comidas||[])){
    const txt=ESTIMADOR.norm(c.nombre+" "+(c.items||[]).join(" "));
    for(const [f,re] of Object.entries(FAMILIAS)) if(re.test(txt)) cuenta[f]=(cuenta[f]||0)+1; }
  gustoCache={clave, cuenta}; return cuenta;
}
function afinidad(r, cuenta){ const fams=new Set(r.i.map(([id])=>FAM_ING[id]).filter(Boolean)); let p=0; for(const f of fams) p+=Math.min(cuenta[f]||0,4)*0.5; return p; }
function elegir(slot){
  const f=candidatos(slot); if(!f.length) return {rec:null, count:0};
  const top=f.filter((r,i)=>i<Math.max(3,Math.ceil(f.length/2)));
  const base=hash(S.today+slot)%top.length; const off=S.offsets[slot]||0;
  const list = off<top.length ? top : f;
  return {rec:list[(base+off)%list.length], count:f.length};
}
function fitFactor(rec, kcalObj){ let best=1, d=Infinity; for(let f=0.6; f<=1.8001; f+=0.05){ const k=nutr(rec,f).kcal; if(Math.abs(k-kcalObj)<d){ d=Math.abs(k-kcalObj); best=Math.round(f*100)/100; } } return best; }
function factorFor(slot, rec){
  let obj = PLAN.kcal*slotShare(slot);
  const ultimo = slotsHoy()[slotsHoy().length-1][0];
  let why="";
  if(slot===ultimo && exKcal()>0){ obj += exKcal(); why=`Porción un poco más grande por tu actividad de hoy.`; }
  return {f:fitFactor(rec,obj), why};
}

// ==== SINCRONIZACIÓN CON LA BASE COMÚN (Supabase) ====
const SYNC_ON = () => !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && DB.consent?.share);
let secretHash=null;
async function getHash(){
  if(secretHash) return secretHash;
  try{ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(DB.secret)); secretHash=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  catch(e){ secretHash="h"+hash(DB.secret).toString(16); }
  return secretHash;
}
function perfilCompartible(){
  const r={...DB.perfil.resp}; if(r.relacion==="control"||r.relacion==="tca") r.relacion="no_informado"; delete r.relacion_otro; delete r.datos;
  r.tiempos_s = DB.perfil.tiempos||{}; return r;
}
function enviar(tipo, datos, fecha, urgente){
  if(!DB.consent?.share) return;
  DB.cola.push({tipo, fecha: fecha||S.today, datos, creado:new Date().toISOString()}); persist();
  if(urgente) flush(true); else flushSoon();
}
let flushT=null, flushing=false;
function flushSoon(){ clearTimeout(flushT); flushT=setTimeout(flush, 1500); }
async function flush(urgente){
  if(flushing || !SYNC_ON() || !DB.cola.length || !navigator.onLine) return;
  flushing=true;
  try{
    const tk = DB.auth? await tokenVigente() : CONFIG.SUPABASE_ANON_KEY; if(!tk){ flushing=false; return; }
    const h=await getHash(); const lote=DB.cola.slice(0, urgente? 20 : 200);
    const rows=lote.map(e=>({anon_id:DB.anonId, secret_hash:h, tipo:e.tipo, fecha:e.fecha, datos:e.datos, creado:e.creado, app_version:CONFIG.APP_VERSION}));
    const res=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/eventos",{method:"POST", keepalive:!!urgente,
      headers:{"apikey":CONFIG.SUPABASE_ANON_KEY,"Authorization":"Bearer "+tk,"Content-Type":"application/json","Prefer":"return=minimal"},
      body:JSON.stringify(rows)});
    if(res.ok){ DB.cola.splice(0,lote.length); persist(); if(DB.cola.length) flushSoon(); }
  }catch(e){}
  flushing=false;
}

// ==== SESIONES DE USO ====
// Una sesión va desde que la app se abre (o vuelve al frente) hasta que pasa a segundo plano o se cierra.
// Si vuelve en menos de un minuto, sigue la misma sesión. Se envía cada vez que la app pasa a segundo plano,
// con el mismo id: para analizar, vale el último envío de cada id.
const SES_PAUSA=60000;
function sesionEnviar(s, urgente){
  enviar("sesion",{id:s.id, inicio:new Date(s.inicio).toISOString(), fin:new Date(s.fin).toISOString(), duracion_s:Math.round((s.fin-s.inicio)/1000)}, dayKey(new Date(s.inicio)), urgente);
}
function sesionIniciar(){
  const ahora=Date.now(), s=DB.sesion;
  if(s && s.fin && ahora-s.fin<SES_PAUSA){ s.fin=null; s.ultimo=ahora; persist(); return; }
  if(s && !s.fin){ s.fin=s.ultimo||s.inicio; sesionEnviar(s); }   // se cerró sin aviso: termina en su último registro
  DB.sesion={id:uid(), inicio:ahora, ultimo:ahora, fin:null}; persist();
}
function sesionPausar(){ const s=DB.sesion; if(!s || s.fin) return; s.fin=s.ultimo=Date.now(); persist(); sesionEnviar(s, true); }
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ sesionPausar(); DB.cerradaDesde=Date.now(); persist(); } else { sesionIniciar(); if(movAlVolver() && S.view==="hoy") render(); delete DB.cerradaDesde; persist(); } });

// Marca nombrada en el texto («yogur Ser», «una coca»), si la hay.
function marcaEnTexto(prod, txt){
  const t=" "+ESTIMADOR.norm(txt)+" ";
  let mejor=null; for(const [k,o] of Object.entries(MARCAS[prod].opts)) for(const a of o.al){ if(t.includes(" "+a+" ") && (!mejor || a.length>mejor[1])) mejor=[k,a.length]; }
  return mejor? mejor[0] : null;
}
function prodDe(nombre){ return Object.keys(MARCAS).find(k=>MARCAS[k].alimentos.includes(nombre)); }
function marcasPendientes(r, txt){ return [...new Set(r.items.map(it=>prodDe(it.n)).filter(k=>k && !DB.marcas?.[k] && !marcaEnTexto(k,txt)))]; }
function guardarMarcas(m){ const x=Object.entries(m||{}).filter(([,v])=>v); if(!x.length) return; DB.marcas={...(DB.marcas||{}), ...Object.fromEntries(x)}; persist(); }
// Rehace la cuenta de una comida escrita con los valores de la marca de cada producto («otra» = valores generales).
function conMarcas(r, txt){
  const out={kcal:r.kcal, prot:r.prot, carb:r.carb, grasa:r.grasa, fibra:r.fibra, items:[], marcas:{}};
  for(const it of r.items){
    const k=prodDe(it.n), m=k && (marcaEnTexto(k,txt) || DB.marcas?.[k]), o=m && MARCAS[k].opts[m], gen=ESTIMADOR.alimento(it.n);
    if(!o || !gen){ out.items.push(ESTIMADOR.describir(it)); continue; }
    out.marcas[k]=m;
    let g=it.g; if(o.u && gen.u && it.g%gen.u===0) g=it.g/gen.u*o.u;   // por unidades: el tamaño de la unidad de esa marca
    const d=(a,b)=>(a*g-b*it.g)/100;
    out.kcal+=d(o.k,gen.k); out.prot+=d(o.p,gen.p); out.carb+=d(o.hc,gen.hc); out.grasa+=d(o.gr,gen.gr); out.fibra+=d(o.f,gen.f);
    out.items.push(ESTIMADOR.describir({...it, g, u:o.u||it.u})+" ("+o.n+")");
  }
  for(const c of ["kcal","prot","carb","grasa","fibra"]) out[c]=Math.max(0,Math.round(out[c]));
  return out;
}

    if(Array.isArray(sg) && sg.length){
      const tabla = it.relleno? RELLENOS : it.n==="Ensalada mixta"? ENSALADA : HAMBURGUESA;
      if(it.relleno) for(let j=i+1;j<its.length && its[j].auto;j++) fuera.add(j);   // el relleno típico se reemplaza por lo elegido
      if(it.n==="Ensalada mixta") fuera.add(i);
      for(const n of sg){ const x=tabla.find(t=>t[0]===n); if(x) extra.push(nuevoItem(n,x[2])); if(it.n==="Hamburguesa con pan" && n==="Lechuga") extra.push(nuevoItem("Tomate",25)); }
    } else if(typeof sg==="string" && sg){ Object.assign(it, nuevoItem(sg, it.g)); }
    if(resp["yog_"+i]==="firme"){ const potes=it.g/(it.u||it.por||200); Object.assign(it, nuevoItem("Yogur firme", 1)); it.g=Math.round(potes*(it.u||it.por)); }
    const pr=resp["por_"+i]; if(pr) it.g=Math.max(1, Math.round(it.g*PORCION[pr]));
  });
  return its.filter((_,i)=>!fuera.has(i)).concat(extra);
}

// ==== HAMBRE Y EMOCIONES: pregunta breve antes de guardar ====
const HAMBRE=[["ninguna","Nada de hambre"],["poca","Poca"],["moderada","Moderada"],["mucha","Mucha"]];
const MOTIVO=[["hambre","Hambre física"],["horario","Horario o costumbre"],["emocion","Ansiedad o estrés"],["aburrimiento","Aburrimiento"]];
// Preguntas después de registrar: de a una, con barra de progreso y opciones en columna (formato del cuestionario).
// Máximo 6, siempre con «Saltear». Hambre y motivo van siempre al final; el resto se recorta si no entra.
const MAX_PREGUNTAS=6;
function flujoPreguntas(pasos, alTerminar){
  const resp={}, cola=pasos.slice(); let hechas=0;
  const reservadas = () => cola.filter(p=>p.fija).length;
  const sheet=$("#sheet");
  const siguiente=()=>{
    while(cola.length && cola[0].dyn){ const d=cola.shift(); cola.unshift(...d.dyn(resp)); }   // pasos que dependen de respuestas anteriores
    while(cola.length && !cola[0].fija && hechas+reservadas()>=MAX_PREGUNTAS) cola.shift();
    if(!cola.length){ cerrarSheet(); alTerminar(resp); return; }
    const p=cola.shift(); hechas++; dibujar(p);
  };
  const dibujar=p=>{
    const total=Math.min(MAX_PREGUNTAS, hechas+cola.filter(x=>!x.dyn).length);
    let sel = p.tipo==="multi"? [] : null; let otro="";
    const opts=el("div",{class:"choices"});
    const otroIn=el("input",{type:"text",id:"preg-otro",placeholder:"Contalo en pocas palabras",hidden:true});
    otroIn.addEventListener("input",()=>{ otro=otroIn.value; });
    const listo=v=>{ resp[p.id]= p.tipo==="multi"? v : v; if(v==="otro") resp[p.id+"Otro"]=otro||undefined; siguiente(); };
    const sig=el("button",{class:"btn primary",type:"button",onclick:()=>listo(sel)},"Siguiente");
    const draw=()=>{ opts.replaceChildren(...p.opts.concat(p.otro? [["otro","Otro"]] : []).map(([v,t,d])=>{ const on = p.tipo==="multi"? sel.includes(v) : sel===v;
      return el("button",{type:"button",class:"choice"+(on?" on":""),"aria-pressed":String(on),onclick:()=>{
        if(p.tipo==="multi"){ sel = on? sel.filter(x=>x!==v) : sel.concat(v); draw(); return; }
        sel=v; draw(); if(v==="otro"){ otroIn.hidden=false; otroIn.focus(); sig.hidden=false; return; } setTimeout(()=>listo(v),160); }},
        t, d? el("span",{class:"choice-det"},d) : null); })); };
    draw(); sig.hidden = p.tipo!=="multi";
    sheet.replaceChildren(el("div",{class:"sheet-card preguntas"},
      el("div",{class:"onb-prog"}, el("i",{style:`width:${hechas/Math.max(total,1)*100}%`})),
      el("div",{class:"eyebrow"},"Antes de guardar"), el("h2",{},p.titulo), p.sub? el("p",{class:"note"},p.sub) : null,
      opts, otroIn,
      el("div",{class:"row onb-nav"}, el("button",{class:"btn ghost",type:"button",onclick:()=>siguiente()},"Saltear"), sig)));
    sheet.hidden=false;
  };
  siguiente();
}
const pasoHambre = {id:"hambre", fija:true, titulo:"¿Cuánta hambre tenías?", sub:"Sirve para que veas tus patrones, no para juzgarte.", tipo:"single", otro:true, opts:HAMBRE};
const pasoMotivo = {id:"motivo", fija:true, titulo:"¿Qué te llevó a comer?", tipo:"single", otro:true, opts:MOTIVO};
const pasosMarcas = prods => prods.map(k=>({id:"marca_"+k, titulo:`¿Qué marca de ${MARCAS[k].n} era?`, sub:"Te lo preguntamos una sola vez.", tipo:"single",
  opts:Object.entries(MARCAS[k].opts).map(([v,o])=>[v,o.n]).concat([["otra","Otra o no sé"]])}));
const emoDe = resp => ({hambre:resp.hambre&&resp.hambre!=="otro"? resp.hambre : resp.hambre, motivo:resp.motivo, emoOtro:resp.hambreOtro||resp.motivoOtro||undefined});

function preguntarEmocion(onDone, marcasPend=[]){

// Cantidades en medidas caseras («1 puñado», «2 cucharadas», «½ lata»); los gramos solo se usan para calcular.
function medidaIng(id, g){
  const x=ingOf(id), c = CASERA[id] || (x.u? [x.u, x.uN||"unidad", (x.uN||"unidad")+"s"] : null);
  if(!c) return "1 porción";
  const entero = !CASERA[id] || CASERA[id][3];   // huevos, frutas, rebanadas, latas de atún: unidades enteras
  const n = entero? Math.max(1, Math.round(g/c[0])) : Math.max(0.5, Math.round(g/c[0]*2)/2);
  return `${frac(n)} ${n>1? c[2] : c[1]}`;
}

// Arrastre horizontal con el dedo (o el mouse): pasado un umbral, la tarjeta sale de la pantalla y se llama a alSalir.
function deslizable(card, alSalir){
  let x0=null, y0=0, dx=0, id=null, horizontal=null;
  card.addEventListener("pointerdown",ev=>{ if(ev.target.closest("button,a,input,textarea,select")) return; x0=ev.clientX; y0=ev.clientY; dx=0; id=ev.pointerId; horizontal=null; card.style.transition="none"; });
  card.addEventListener("pointermove",ev=>{ if(x0==null || ev.pointerId!==id) return; dx=ev.clientX-x0; const dy=ev.clientY-y0;
    if(horizontal==null && (Math.abs(dx)>8 || Math.abs(dy)>8)){ horizontal=Math.abs(dx)>Math.abs(dy); if(horizontal) card.setPointerCapture(id); }
    if(horizontal){ card.style.transform=`translateX(${dx}px) rotate(${dx/40}deg)`; card.style.opacity=String(1-Math.min(Math.abs(dx)/320,0.6)); } });
  const fin=()=>{ if(x0==null) return; const salir=horizontal && Math.abs(dx)>110; x0=null;
    card.style.transition="transform .2s ease-out, opacity .2s ease-out";
    if(salir){ card.style.transform=`translateX(${Math.sign(dx)*window.innerWidth}px)`; card.style.opacity="0"; setTimeout(alSalir,200); }
    else { card.style.transform=""; card.style.opacity=""; } };
  for(const e of ["pointerup","pointercancel"]) card.addEventListener(e,fin);
}

function progreso(comidas){

function cicloInfo(){
  const R=DB.perfil?.resp; if(!R || R.sexo!=="m" || !R.cicloApp || R.cicloApp==="off" || !R.ciclo?.ultimo) return null;
  const dur=clamp(+R.ciclo.duracion||28,20,45), desde=Math.round((keyDate(S.today)-keyDate(R.ciclo.ultimo))/864e5);
